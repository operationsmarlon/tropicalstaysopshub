<style>
:root{
  --dgreen:#204f34; --dgreen2:#173a26; --dgreen3:#0f2a1b;
  --sage:#a4c598; --sage-d:#8bb07d;
  --tan:#ba9078; --brown:#a55d56;
  --bg:#f4f7f2; --card:#ffffff;
  --ink:#16241c; --ink2:#3c5145; --muted:#6f8175;
  --line:#e3ebe0; --line2:#d3ded0;
  --ok:#2f7d51; --ok-l:rgba(47,125,81,.10); --ok-b:rgba(47,125,81,.30);
  --warn:#9a6a1a; --warn-l:rgba(154,106,26,.10); --warn-b:rgba(154,106,26,.30);
  --alert:#a53f34; --alert-l:rgba(165,63,52,.10); --alert-b:rgba(165,63,52,.30);
  --info:#2e6d8a; --info-l:rgba(46,109,138,.10); --info-b:rgba(46,109,138,.30);
  --sage-l:rgba(164,197,152,.16); --sage-b:rgba(164,197,152,.5);
  --disp:'Fraunces',Georgia,serif;
  --body:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'Courier New',monospace;
  --r:6px; --r2:10px; --r3:14px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:13px;line-height:1.55;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
h1,h2,h3{margin:0}

/* ---------- app lock ---------- */
#lock{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 90% at 50% 0%,var(--dgreen) 0%,var(--dgreen2) 55%,var(--dgreen3) 100%)}
#lock .panel{width:340px;max-width:92vw;text-align:center;padding:8px}
.lock-badge{background:#fff;border-radius:14px;padding:16px 20px;margin:0 auto 26px;width:264px;max-width:78%;box-shadow:0 12px 34px rgba(0,0,0,.28)}
.lock-badge img{width:100%;display:block}
#lock .msg{min-height:20px;font-size:13px;color:#d6e6cf;margin-bottom:16px}
.dots{display:flex;gap:12px;justify-content:center;margin-bottom:22px}
.dot{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--sage);opacity:.4}
.dot.on{background:var(--sage);opacity:1}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;max-width:250px;margin:0 auto}
.keypad button{aspect-ratio:1;border:1px solid rgba(164,197,152,.32);background:rgba(255,255,255,.05);color:#eef5ea;
  font-size:19px;font-family:var(--mono);border-radius:var(--r2);cursor:pointer;transition:background .12s}
.keypad button:hover{background:rgba(255,255,255,.11)}
.keypad button.util{font-size:11px;letter-spacing:.05em;text-transform:uppercase}

/* ---------- shell ---------- */
.shell{display:flex;height:100vh;overflow:hidden}
#app{display:none}

/* ---------- sidebar ---------- */
.side{width:236px;flex-shrink:0;background:var(--dgreen2);display:flex;flex-direction:column;user-select:none;
  border-right:1px solid rgba(0,0,0,.2)}
.side-head{display:flex;align-items:center;gap:11px;padding:16px 15px 12px}
.side-mark{height:38px;width:auto;flex-shrink:0}
.side-word{min-width:0;line-height:1.15}
.side-word b{display:block;color:#fff;font-family:var(--disp);font-size:16px;font-weight:600}
.side-word span{display:block;color:var(--sage);font-family:var(--mono);font-size:7.5px;letter-spacing:.2em;text-transform:uppercase;margin-top:2px}
.side-search{position:relative;margin:2px 12px 8px}
.side-search input{width:100%;background:rgba(255,255,255,.06);border:1px solid transparent;border-radius:var(--r);
  color:#fff;font-family:var(--body);font-size:12px;padding:7px 9px 7px 28px;outline:none;transition:.14s}
.side-search input::placeholder{color:rgba(255,255,255,.34)}
.side-search input:focus{background:rgba(255,255,255,.1);border-color:var(--sage-b)}
.side-search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:13px;height:13px;
  fill:none;stroke:rgba(255,255,255,.4);stroke-width:1.8}
.nav{flex:1;overflow-y:auto;padding:2px 10px 12px}
.nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14)}
.nav-grp{font-family:var(--mono);font-size:8px;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(255,255,255,.32);padding:12px 8px 5px}
.nb{position:relative;display:flex;align-items:center;gap:10px;width:100%;font-size:12.5px;
  padding:7px 9px;border-radius:var(--r);border:none;background:none;color:rgba(255,255,255,.66);
  cursor:pointer;transition:.12s;text-align:left;margin-bottom:1px}
.nb svg{width:16px;height:16px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.62}
.nb .ct{margin-left:auto;font-family:var(--mono);font-size:10px;background:rgba(255,255,255,.09);
  color:rgba(255,255,255,.7);padding:1px 6px;border-radius:9px;min-width:18px;text-align:center}
.nb .ct.warn{background:var(--brown);color:#fff}
.nb:hover{color:#fff;background:rgba(255,255,255,.06)}
.nb:hover svg{opacity:.95}
.nb.on{background:var(--sage-l);color:#fff}
.nb.on svg{opacity:1;stroke:var(--sage)}
.nb.on::before{content:'';position:absolute;left:-10px;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--sage)}
.nb.hide{display:none}
.nb.lock{color:rgba(186,144,120,.95)}
.side-foot{padding:10px 15px;border-top:1px solid rgba(255,255,255,.08);
  font-family:var(--mono);font-size:9px;color:rgba(255,255,255,.4);display:flex;justify-content:space-between;align-items:center}
.side-foot b{color:rgba(255,255,255,.7);font-weight:500}

/* ---------- main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh}
.topbar{display:flex;align-items:center;gap:14px;height:56px;padding:0 22px;background:var(--card);
  border-bottom:1px solid var(--line);flex-shrink:0}
.tb-crumb{font-family:var(--mono);font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--tan)}
.tb-title{font-family:var(--disp);font-size:20px;font-weight:500;color:var(--ink);white-space:nowrap;margin-top:1px}
.tb-right{display:flex;align-items:center;gap:12px;margin-left:auto}
.clk{text-align:right;line-height:1.2}
.clk .z{font-family:var(--mono);font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.clk .t{font-family:var(--mono);font-size:13px;color:var(--ink2);font-weight:500}
.clk .d{font-family:var(--mono);font-size:8px;color:var(--muted)}
.clk-div{width:1px;height:26px;background:var(--line)}
.sync{font-family:var(--mono);font-size:9px;color:var(--muted);background:var(--bg);border:1px solid var(--line);
  padding:4px 8px;border-radius:20px;white-space:nowrap}
.sync b{color:var(--ink2);font-weight:500}
.tb-lock{background:transparent;border:1px solid var(--line2);color:var(--ink2);border-radius:var(--r);
  padding:6px 11px;font-size:11.5px;cursor:pointer;display:flex;align-items:center;gap:5px}
.tb-lock:hover{background:var(--bg)}
.tb-lock svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.8}

.page{flex:1;overflow-y:auto;padding:24px 26px 60px}
.pg-eyebrow{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--tan);margin-bottom:5px}
.pg-title{font-family:var(--disp);font-size:26px;font-weight:500;color:var(--ink);line-height:1.1}
.pg-sub{color:var(--muted);font-size:12.5px;margin-top:6px;max-width:720px}
.pg-head{margin-bottom:18px}

/* ---------- kpi ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:14px 15px}
.kpi .l{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--disp);font-size:30px;font-weight:500;color:var(--ink);line-height:1.05;margin-top:3px}
.kpi .s{font-size:11px;color:var(--muted);margin-top:2px}
.kpi.accent{background:linear-gradient(150deg,var(--dgreen) 0%,var(--dgreen2) 100%);border-color:var(--dgreen)}
.kpi.accent .l{color:var(--sage)}
.kpi.accent .v,.kpi.accent .s{color:#fff}

/* ---------- cards / grid ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.card-hd{display:flex;align-items:center;gap:8px;padding:11px 15px;border-bottom:1px solid var(--line)}
.card-hd h3{font-size:13px;font-weight:600;color:var(--ink)}
.card-hd .sp{margin-left:auto}
.card-bd{padding:15px}
.card-bd.tight{padding:0}

/* ---------- chips / pills ---------- */
.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:9.5px;font-weight:500;
  letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:20px;border:1px solid var(--line2);color:var(--muted);background:var(--bg)}
.chip.ok{color:var(--ok);background:var(--ok-l);border-color:var(--ok-b)}
.chip.warn{color:var(--warn);background:var(--warn-l);border-color:var(--warn-b)}
.chip.alert{color:var(--alert);background:var(--alert-l);border-color:var(--alert-b)}
.chip.info{color:var(--info);background:var(--info-l);border-color:var(--info-b)}
.chip.sage{color:var(--dgreen);background:var(--sage-l);border-color:var(--sage-b)}
.tag{display:inline-block;font-size:10.5px;color:var(--ink2);background:var(--bg);border:1px solid var(--line2);
  padding:1px 7px;border-radius:5px;margin:2px 3px 0 0}

/* ---------- tables ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);font-weight:500;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--bg)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--bg)}
.tbl .rowact{text-align:right;white-space:nowrap}
.wrap{overflow-x:auto}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;padding:7px 13px;border-radius:var(--r);
  border:1px solid var(--dgreen);background:var(--dgreen);color:#fff;cursor:pointer;transition:.12s;white-space:nowrap}
.btn:hover{background:var(--dgreen2)}
.btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.9}
.btn.ghost{background:transparent;color:var(--ink2);border-color:var(--line2)}
.btn.ghost:hover{background:var(--bg)}
.btn.sage{background:var(--sage);border-color:var(--sage);color:var(--dgreen3)}
.btn.sage:hover{background:var(--sage-d)}
.btn.danger{background:transparent;color:var(--alert);border-color:var(--alert-b)}
.btn.danger:hover{background:var(--alert-l)}
.btn.sm{padding:4px 9px;font-size:11px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.filterbtn{font-size:11.5px;padding:5px 11px;border-radius:20px;border:1px solid var(--line2);background:var(--card);
  color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.filterbtn .n{font-family:var(--mono);font-size:10px;color:var(--muted)}
.filterbtn.on{background:var(--dgreen);border-color:var(--dgreen);color:#fff}
.filterbtn.on .n{color:var(--sage)}

/* ---------- forms ---------- */
.field{margin-bottom:12px}
.field label{display:block;font-size:11.5px;font-weight:600;color:var(--ink2);margin-bottom:4px}
.inp,select.inp,textarea.inp{width:100%;font-family:var(--body);font-size:12.5px;color:var(--ink);
  background:var(--card);border:1px solid var(--line2);border-radius:var(--r);padding:7px 9px;outline:none;transition:.12s}
.inp:focus{border-color:var(--sage-d);box-shadow:0 0 0 3px var(--sage-l)}
textarea.inp{resize:vertical;min-height:64px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chkline{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2)}
.chkline input{width:15px;height:15px;accent-color:var(--dgreen)}

/* ---------- misc ---------- */
.empty{text-align:center;padding:26px 16px;color:var(--muted)}
.empty h4{color:var(--ink2);font-size:14px;margin-bottom:4px;font-family:var(--disp);font-weight:500}
.empty p{font-size:12px;max-width:340px;margin:0 auto}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
.rowline{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}
.rowline:last-child{border-bottom:none}
.rowline .grow{flex:1;min-width:0}
.note{font-size:11.5px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;margin-top:12px}
.attn{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;background:var(--card)}
.attn .big{font-family:var(--disp);font-size:22px;font-weight:500;min-width:34px;text-align:center}
.attn.alert{border-color:var(--alert-b);background:var(--alert-l)}
.attn.alert .big{color:var(--alert)}
.attn.warn{border-color:var(--warn-b);background:var(--warn-l)}
.attn.warn .big{color:var(--warn)}
.attn.ok{border-color:var(--ok-b);background:var(--ok-l)}
.attn.ok .big{color:var(--ok)}
.attn .lbl{font-size:12px;color:var(--ink2)}
.attn .go{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--muted);cursor:pointer}
.attn .go:hover{color:var(--ink)}
.prog{height:7px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--sage);border-radius:6px}
.sec-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:2px 0 6px}
.pdetail dt{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:10px}
.pdetail dd{margin:2px 0 0;font-size:13px;color:var(--ink)}
.linkbtn{background:none;border:none;color:var(--info);cursor:pointer;font-size:12px;padding:0;font-family:inherit}
.linkbtn:hover{text-decoration:underline}

/* ---------- overlay / modal ---------- */
#overlay{position:fixed;inset:0;z-index:70;background:rgba(15,42,27,.4);display:none;align-items:flex-start;justify-content:center;padding:44px 16px;overflow-y:auto}
#overlay.on{display:flex}
.modal{background:var(--card);border-radius:var(--r3);width:560px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.28);display:flex;flex-direction:column;max-height:calc(100vh - 88px)}
.modal-hd{display:flex;align-items:center;padding:15px 20px;border-bottom:1px solid var(--line);flex-shrink:0}
.modal-hd h3{font-family:var(--disp);font-size:17px;font-weight:500}
.modal-hd .x{margin-left:auto;background:none;border:none;font-size:20px;color:var(--muted);cursor:pointer;line-height:1}
.modal-bd{padding:20px;overflow-y:auto;flex:1 1 auto}
.modal-ft{display:flex;justify-content:flex-end;gap:9px;padding:14px 20px;border-top:1px solid var(--line);flex-shrink:0;flex-wrap:wrap}

/* vault modal */
#vaultModal{position:fixed;inset:0;z-index:75;background:rgba(15,42,27,.5);display:none;align-items:center;justify-content:center}
#vaultModal .vbox{background:var(--dgreen2);border-radius:var(--r3);padding:26px 22px;width:310px;text-align:center}
#vaultModal img{width:44px;margin:0 auto 10px;display:block;opacity:.9}
#vaultModal .vt{color:#fff;font-family:var(--disp);font-size:17px;margin-bottom:4px}
#vaultModal .vm{color:#cfe0c6;font-size:12px;margin-bottom:14px}
#vaultModal .vx{margin-top:14px;background:none;border:none;color:rgba(255,255,255,.6);font-size:11px;cursor:pointer}

/* toast */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--dgreen3);color:#fff;
  font-size:12.5px;padding:10px 18px;border-radius:22px;opacity:0;pointer-events:none;transition:.22s;z-index:90;max-width:80vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.subprog>div{height:100%;background:var(--dgreen)}
.sublist{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.subrow{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}
.subrow .subdone div:first-child{text-decoration:line-through;color:var(--muted)}
.tdgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tdrow{display:flex;flex-direction:column;gap:3px}
.tdrow .tdk{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--tan)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--tan);text-align:center;padding:2px 0}
.cal-cell{min-height:78px;border:1px solid var(--line);border-radius:var(--r);padding:4px;background:var(--card);overflow:hidden}
.cal-cell.out{background:var(--bg);opacity:.55}
.cal-cell.today{border-color:var(--dgreen);box-shadow:inset 0 0 0 1px var(--dgreen)}
.cal-num{font-family:var(--mono);font-size:10px;color:var(--ink2);margin-bottom:2px}
.cal-task{font-size:10px;line-height:1.25;padding:2px 5px;border-radius:4px;margin-bottom:3px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid var(--line2);background:var(--card)}
.cal-task.info{background:var(--info-l);border-color:var(--info-b)}
.cal-task.warn{background:#fff4e5;border-color:#ffd9a8}
.cal-task.alert{background:#fdecec;border-color:#f5c2c2}
.cal-task.ok,.cal-task.sage{background:var(--sage-l);border-color:var(--sage-b)}
@media(max-width:760px){.tdgrid{grid-template-columns:1fr}.cal-cell{min-height:54px}.cal-task{font-size:9px}.tcol{flex:0 0 82vw}}
.updcompose{border:1px solid var(--line);border-radius:var(--r2);padding:10px;background:var(--bg)}
.updlist{display:flex;flex-direction:column;gap:8px}
.upditem{border:1px solid var(--line);border-radius:var(--r2);padding:10px 12px;background:var(--card)}
.updhd{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);margin-bottom:5px}
.updhd b{color:var(--ink);font-size:12.5px}
.updhd .mono{font-family:var(--mono);font-size:10px;color:var(--tan)}
.updtext{font-size:13px;white-space:normal;line-height:1.5}
.stickytop{position:sticky;top:0;z-index:8;background:var(--bg);margin:-24px -26px 16px;padding:12px 26px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
@media(max-width:760px){.stickytop{margin:-16px -14px 12px;padding:10px 14px}}
.tb-burger{display:none;background:transparent;border:1px solid var(--line2);border-radius:var(--r);width:36px;height:36px;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.tb-burger svg{width:18px;height:18px;stroke:var(--ink2);stroke-width:2;fill:none;stroke-linecap:round}
#sideScrim{display:none}
@media(max-width:760px){
  .tb-burger{display:inline-flex}
  .topbar{padding:0 14px;gap:10px;height:52px}
  .tb-title{font-size:17px}
  .clk,.clk-div{display:none}
  .tb-user{display:none!important}
  .side{width:82vw;max-width:300px;box-shadow:2px 0 24px rgba(0,0,0,.35)}
  .side.open ~ #sideScrim{display:block;position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.42)}
  .page{padding:16px 14px!important}
  .toolbar{padding:8px 14px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .toolbtn.edit{margin-left:6px}
  .grid3{grid-template-columns:1fr!important}
  .grid2{grid-template-columns:1fr!important}
  .row2{grid-template-columns:1fr!important}
  .split2{grid-template-columns:1fr!important}
  .kpis{grid-template-columns:repeat(2,1fr)!important}
  .subtabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .modal{width:94vw!important;max-width:94vw!important;max-height:88vh}
  .pg-title{font-size:22px}
  .tbl{font-size:12px}
  .refgrid{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
}
@media(display-mode:standalone){ .topbar{padding-top:env(safe-area-inset-top)} }

/* ===== screenshot-aligned shared design layer ===== */
.card{box-shadow:0 1px 2px rgba(16,42,27,.045),0 1px 3px rgba(16,42,27,.03)}
.chip{font-weight:600}
.hero{background:linear-gradient(135deg,var(--dgreen2),var(--dgreen3));border-radius:var(--r3);padding:18px 18px 16px;color:#eaf3ea;margin-bottom:16px;border:1px solid rgba(255,255,255,.06)}
.hero .hero-t{font-family:var(--disp);font-size:15px;color:#fff;margin-bottom:2px}
.hero .hero-s{font-size:12px;color:rgba(234,243,234,.72);margin-bottom:14px;max-width:70ch}
.hero .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.hero .step{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:10px;padding:11px 12px}
.hero .step .n{font-size:11px;font-weight:700;color:#fff;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.hero .step .d{font-size:10.5px;line-height:1.4;color:rgba(234,243,234,.72)}
.htag{font:9px var(--mono);letter-spacing:.03em;text-transform:uppercase;padding:2px 7px;border-radius:20px;white-space:nowrap}
.htag-teal{background:rgba(46,109,138,.24);color:#bfe0ec}
.htag-blue{background:rgba(80,120,200,.24);color:#cdd9f5}
.htag-gold{background:rgba(200,160,60,.24);color:#f0dca6}
.htag-green{background:rgba(90,170,110,.24);color:#c8ecca}
.htag-purple{background:rgba(150,110,190,.24);color:#e0cff0}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:20px;border:1px solid transparent;white-space:nowrap}
.pill.ok{background:var(--ok-l);color:var(--ok);border-color:var(--ok-b)}
.pill.warn{background:var(--warn-l);color:var(--warn);border-color:var(--warn-b)}
.pill.alert{background:var(--alert-l);color:var(--alert);border-color:var(--alert-b)}
.pill.info{background:var(--info-l);color:var(--info);border-color:var(--info-b)}
.pill.mut{background:var(--bg);color:var(--muted);border-color:var(--line)}
.sechd{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.sechd h3{font-family:var(--disp);font-size:15px;margin:0}
.sechd .ct{font:10px var(--mono);color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:2px 8px}
.sechd .sp{margin-left:auto;display:flex;gap:8px}
.rescard{border:1px solid var(--line);border-radius:var(--r3);background:var(--card);margin-bottom:12px;overflow:hidden;box-shadow:0 1px 2px rgba(16,42,27,.04)}
.resh{display:flex;gap:12px;align-items:center;padding:14px 16px;cursor:pointer;flex-wrap:wrap}
.resh:hover{background:var(--sage-l)}
.resb{padding:2px 16px 16px;border-top:1px solid var(--line)}
.cleancard{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg);margin-bottom:10px}
.caret{color:var(--muted);font-size:11px;transition:transform .15s;display:inline-block}
.caret.open{transform:rotate(90deg)}
.chkrow{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.chkpill{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer;user-select:none}
.chkpill.on{background:var(--ok-l);border-color:var(--ok-b);color:var(--ok)}


/* ===== mobile friendliness pass ===== */
@media(max-width:760px){
  /* stop iOS auto-zoom when focusing a field (needs >=16px) */
  .inp,select.inp,textarea.inp,#loginEmail,#loginPass{font-size:16px}
  /* finger-sized tap targets */
  .btn{padding:9px 14px;font-size:13px}
  .btn.sm{padding:7px 11px;font-size:12px}
  .segbtn{padding:9px 13px;font-size:12.5px}
  select.inp{min-height:40px;padding:8px 9px}
  .nb{padding-top:11px;padding-bottom:11px}
  .toolbtn{padding:8px 12px}
  /* wide tables scroll instead of getting crushed */
  .card-bd,.wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tbl{font-size:12px}
  .tbl th{padding:8px 9px;white-space:nowrap}
  .tbl td{padding:8px 9px}
  /* segmented toggles never overflow the screen */
  .seg{max-width:100%}
  /* tighter chrome so content gets the room */
  .hero{padding:15px 14px 13px}
  .card-bd{padding:13px}
  .kpi{padding:12px 13px}
  /* keep everything inside the viewport, no sideways page drift */
  .page{max-width:100vw;overflow-x:hidden}
  .cleancard,.rescard{max-width:100%}
  .resh{gap:8px;padding:12px 13px}
}
@media(max-width:430px){
  .kpis{grid-template-columns:1fr 1fr!important;gap:8px}
  .pg-title{font-size:20px}
  .pg-sub{font-size:12px}
  .hero .steps{grid-template-columns:1fr}
}
/* mobile top-bar: clear the status bar, bigger burger tap target */
@media(max-width:760px){
  .topbar{height:auto;min-height:52px;padding-top:calc(env(safe-area-inset-top) + 6px);padding-bottom:6px}
  .tb-burger{width:44px;height:44px}
  .tb-burger svg{width:22px;height:22px}
  #syncPill{font-size:10px;padding:2px 7px}
}
/* ===== bright SaaS re-skin (screenshot direction), overrides tokens hub-wide ===== */
:root{
  --bg:#f6f7f9; --card:#ffffff;
  --ink:#111a24; --ink2:#39424e; --muted:#6b7280;
  --line:#e7eaef; --line2:#dfe3ea;
  --dgreen:#1f9d57;
  --sage:#a7d3b8; --sage-d:#2f9e63; --sage-l:rgba(31,157,87,.10); --sage-b:rgba(31,157,87,.32);
  --tan:#6f8296; --brown:#e5484d;
  --ok:#16a34a; --ok-l:rgba(22,163,74,.11); --ok-b:rgba(22,163,74,.26);
  --warn:#d97706; --warn-l:rgba(217,119,6,.12); --warn-b:rgba(217,119,6,.26);
  --alert:#e5484d; --alert-l:rgba(229,72,77,.11); --alert-b:rgba(229,72,77,.26);
  --info:#3b82f6; --info-l:rgba(59,130,246,.11); --info-b:rgba(59,130,246,.26);
  --disp:'Inter',system-ui,-apple-system,sans-serif;
  --r:8px; --r2:12px; --r3:16px;
}
.pg-title,.tb-title{font-weight:600;letter-spacing:-.01em}
.card-hd h3,.sechd h3{font-weight:600}
.card{box-shadow:0 1px 2px rgba(17,26,36,.04),0 1px 3px rgba(17,26,36,.05)}
.chip,.pill{font-weight:600}
.btn{font-weight:600}
</style>
</head>

: "Park in the driveway or use the free street parking out front. No permit needed."}, {"applies": "Pool homes", "category": "Pool", "title": "Pool and heated pool", "text": "Yes, the home has a private or resort pool. Where the pool is heated, the controls are in the home, details on your check-in guide. Please supervise children at all times."}, {"applies": "Harbour Lights", "category": "Amenities", "title": "Rooftop pool, gym and sauna", "text": "The building has a rooftop pool, gym and sauna for guests. Access is with your fob, hours are posted at the facilities."}, {"applies": "All", "category": "Late checkout", "title": "Early check-in or late checkout", "text": "We are happy to arrange this when the calendar allows, it depends on the next booking and a fee may apply. Tell us your ideal times and we will check."}, {"applies": "All", "category": "Amenities", "title": "Luggage storage", "text": "On-site storage before check-in or after check-out is not available. The service Stasher in town holds bags on your arrival or departure day."}, {"applies": "All", "category": "Amenities", "title": "Mid-stay clean and extra towels", "text": "This home does not receive daily housekeeping, but we can arrange a mid-stay clean and extra towels for a small fee. Tell us the day and we will organise it."}, {"applies": "All", "category": "General", "title": "Extend stay", "text": "Let me check availability for the extra night. If this home is booked, we usually have another nearby that is ready and I will send the link."}, {"applies": "All", "category": "Check-out", "title": "Checkout steps", "text": "Rubbish in the bins, turn everything off including the aircon, lock up, return the keys, run the dishwasher if needed. Let us know your departure time so we can coordinate housekeeping."}, {"applies": "All", "category": "Complaint", "title": "Something not right", "text": "So sorry to hear that, thank you for flagging it. We will look into it right away and make it right. Could you send a photo so we can find the quickest fix?"}], "faqs": [{"applies": "All", "category": "Access", "question": "Do we get a key or use the fob each time?", "answer": "Access is by fob or key used each time you enter and exit. Full instructions come the day before arrival."}, {"applies": "Cairns One", "category": "Access", "question": "How do we get into the gated complex?", "answer": "Dial the gate code from your instructions and we open it remotely, or follow a car through. Keys are in the letterbox, fob opens the garage and front entrance. Return the fob and scramble the lockbox after."}, {"applies": "All", "category": "Housekeeping", "question": "Is there daily cleaning?", "answer": "No. A mid-stay clean and extra towels are available for a small fee on request."}, {"applies": "All", "category": "Luggage", "question": "Can we store luggage before check-in or after checkout?", "answer": "Not on site. Stasher in town holds bags on your arrival or departure day."}, {"applies": "All", "category": "Timing", "question": "Can we check in early or check out late?", "answer": "Sometimes, subject to the next booking. Fees may apply. Ask and we will check the calendar."}, {"applies": "Cairns One", "category": "Parking", "question": "Where do we park at the resort?", "answer": "A designated underground spot by fob, maximum height 1.95 m, plus visitor spots above ground in the complex."}, {"applies": "Standalone houses", "category": "Parking", "question": "Is there parking at the house?", "answer": "Yes, driveway or free street parking out front, no permit needed."}, {"applies": "Pool homes", "category": "Pool", "question": "Is the pool heated?", "answer": "Several of our homes have a heated pool. Where yours does, the controls and details are on your check-in guide."}, {"applies": "All", "category": "Payment", "question": "My card was declined, what now?", "answer": "We can look at updating the card or a cancel and rebook, but only within the booking's cancellation policy. /* ---------- PIN (local convenience lock, not a security boundary) ---------- */
function hashPin(pin){ let h=5381; for(let i=0;i<pin.length;i++){ h=((h<<5)+h)+pin.charCodeAt(i); h=h&0xffffffff; } return String(h>>>0); }
function pinIsSet(){ const s=db("settings",{}); return !!(s&&s.pinHash); }
function setPin(pin){ const s=db("settings",{}); s.pinHash=hashPin(pin); save("settings",s); }
function checkPin(pin){ const s=db("settings",{}); return s.pinHash===hashPin(pin); }

let lockBuf="", lockStage="enter", lockFirst="";
function drawDots(elId,len){ const el=document.getElementById(elId); el.innerHTML=""; for(let i=0;i<4;i++){ const d=document.createElement("div"); d.className="dot"+(i<len?" on":""); el.appendChild(d);} }
function buildKeypad(elId,onDigit,onClear,onEnter){
  const el=document.getElementById(elId); el.innerHTML="";
  ["1","2","3","4","5","6","7","8","9","clr","0","ok"].forEach(k=>{
    const b=document.createElement("button");
    if(k==="clr"){ b.textContent="Clear"; b.className="util"; b.onclick=onClear; }
    else if(k==="ok"){ b.textContent="Enter"; b.className="util"; b.onclick=onEnter; }
    else { b.textContent=k; b.onclick=()=>onDigit(k); }
    el.appendChild(b);
  });
}
function lockDigit(d){ if(lockBuf.length<4){ lockBuf+=d; drawDots("lockDots",lockBuf.length); if(lockBuf.length===4) setTimeout(lockEnter,110); } }
function lockClear(){ lockBuf=""; drawDots("lockDots",0); }
function lockEnter(){
  if(lockBuf.length!==4) return;
  if(!pinIsSet()){
    if(lockStage==="set"){ lockFirst=lockBuf; lockStage="confirm"; lockBuf=""; drawDots("lockDots",0); document.getElementById("lockMsg").textContent="Confirm your new PIN"; return; }
    if(lockStage==="confirm"){
      if(lockBuf===lockFirst){ setPin(lockBuf); enterApp(); }
      else { lockStage="set"; lockFirst=""; lockBuf=""; drawDots("lockDots",0); document.getElementById("lockMsg").textContent="Did not match. Set a 4-digit PIN"; }
      return;
    }
  }
  if(checkPin(lockBuf)) enterApp();
  else { lockBuf=""; drawDots("lockDots",0); document.getElementById("lockMsg").textContent="Incorrect PIN. Try again"; }
}

/* ---------- webhooks ---------- */
function fireWebhook(name,payload){
  const cfg=db("integrationConfig",{webhooks:{}}); const url=(cfg.webhooks||{})[name]||"";
  if(!url){ toast("Saved locally. No "+name+" webhook set."); return; }
  fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({kind:name,at:nowISO(),payload})})
    .then(()=>{ const s=db("settings",{}); s.lastSync=s.lastSync||{}; s.lastSync[name]=nowISO(); save("settings",s); updateSyncPill(); toast("Pushed to "+name+" webhook."); })
    .catch(()=>toast("Webhook failed for "+name+" (saved locally)."));
}
function updateSyncPill(){
  const pill=document.getElementById("syncPill");
  if(!pill) return;
  if(typeof CLOUD!=="undefined" && CLOUD.on){ pill.innerHTML='Sync: <b style="color:var(--ok)">cloud live</b>'; return; }
  const cfg=db("integrationConfig",{webhooks:{}}); const s=db("settings",{});
  const any=Object.values(cfg.webhooks||{}).some(v=>v);
  const stamps=Object.values(s.lastSync||{}).filter(Boolean).sort();
  if(!any){ pill.innerHTML="Sync: <b>local only</b>"; return; }
  if(!stamps.length){ pill.innerHTML="Sync: <b>configured, idle</b>"; return; }
  const last=new Date(stamps[stamps.length-1]);
  pill.innerHTML="Sync: <b>"+last.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})+"</b>";
}

/* ============================================================
   PROPERTY NAME RESOLVER + SPREADSHEET SEEDS (claims, mid-stay)
   ============================================================ */
function resolvePropId(name){
  if(!name) return "";
  const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,"");
  const first=String(name).split(" / ")[0];
  const target=norm(first);
  const P=props();
  let hit=P.find(p=>norm(p.nickname)===target);
  if(!hit) hit=P.find(p=>{ const n=norm(p.nickname); return n && target && (n.indexOf(target)===0||target.indexOf(n)===0); });
  if(!hit) hit=P.find(p=>{ const n=norm(p.nickname); return n && n.length>4 && norm(name).indexOf(n)>=0; });
  return hit?hit.id:"";
}

const TASK_TONE={open:"info",progress:"warn",waiting:"sage",blocked:"alert",done:"ok",cancelled:""};
function taskStatusLabel(s){ const r=TASK_STATUS.find(x=>x[0]===s); return r?r[1]:(s||"Not started"); }
function taskStatusTone(s){ return TASK_TONE[s]!=null?TASK_TONE[s]:"info"; }
function taskActive(t){ return t.status!=="done"&&t.status!=="cancelled"; }
function taskScopeName(t){ return t.property?propName(t.property):"Tropical Stays"; }
function subProgress(t){ const s=t.subtasks||[]; const done=s.filter(x=>x.status==="done").length; return {done:done,total:s.length,pct:s.length?Math.round(done/s.length*100):0}; }
function contactOptions(sel){
  const seen={}; const rows=[];
  db("users",[]).forEach(u=>{ if(u.name&&!seen[u.name.toLowerCase()]){ seen[u.name.toLowerCase()]=1; rows.push({name:u.name,role:"team"}); } });
  db("contacts",[]).forEach(c=>{ if(c.name&&!seen[c.name.toLowerCase()]){ seen[c.name.toLowerCase()]=1; rows.push({name:c.name,role:c.role||""}); } });
  rows.sort((a,b)=>a.name.localeCompare(b.name));
  let found=false; let opts='<option value="">Unassigned</option>';
  rows.forEach(r=>{ if(r.name===sel)found=true; opts+='<option value="'+esc(r.name)+'" '+(sel===r.name?"selected":"")+'>'+esc(r.name)+(r.role?" ("+esc(r.role)+")":"")+'</option>'; });
  if(sel&&!found) opts+='<option value="'+esc(sel)+'" selected>'+esc(sel)+'</option>';
  return opts;
}
function taskStatusSelect(id,cur,cls){ cur=cur||"open";
  return '<select class="statpill '+taskStatusTone(cur)+' '+(cls||"")+'" onclick="event.stopPropagation()" onchange="setTaskStatus(\''+id+'\',this.value)">'
    +TASK_STATUS.map(([k,l])=>'<option value="'+k+'" '+(cur===k?"selected":"")+'>'+esc(l)+'</option>').join("")+'</select>';
}
function setTaskStatus(id,val){ const list=db("tasks",[]); const t=list.find(x=>x.id===id); if(!t)return; t.status=val; t.updated=nowISO(); save("tasks",list); notifyTask("status_changed",t,{to:val}); logAct("edit","tasks",t.title); if(taskDetailOpen!==id) renderPage(currentTab); }
function taskSetField(id,field,val){ const list=db("tasks",[]); const t=list.find(x=>x.id===id); if(!t)return; t[field]=val; t.updated=nowISO(); save("tasks",list); if(field==="assignee"||field==="due"||field==="priority") notifyTask("updated",t,{field:field,to:val}); if(taskDetailOpen!==id) renderPage(currentTab); }

let taskФ={status:"open",q:"",assignee:"",prop:"",prio:"",view:"list",group:"status",month:""};
let taskDetailOpen=null, subDetailOpen=null, subCtx={taskId:null,subId:null}, draggedTask=null;

function taskFilters(list,ignoreStatus){
  let l=list.slice();
  if(!ignoreStatus && taskФ.status!=="all") l=l.filter(t=>(t.status||"open")===taskФ.status);
  if(taskФ.assignee) l=l.filter(t=>t.assignee===taskФ.assignee);
  if(taskФ.prop) l=l.filter(t=> taskФ.prop==="__company"?!t.property:t.property===taskФ.prop);
  if(taskФ.prio) l=l.filter(t=>(t.priority||"P3")===taskФ.prio);
  if(taskФ.q){ const q=taskФ.q.toLowerCase(); l=l.filter(t=>(t.title+" "+(t.notes||"")+" "+taskScopeName(t)+" "+(t.assignee||"")).toLowerCase().indexOf(q)>=0); }
  return l;
}

  const statusChips=taskФ.view==="list"?[["open","Not started"],["progress","In progress"],["waiting","Waiting"],["blocked","Blocked"],["done","Completed"],["all","All"]].map(([k,l])=>'<button class="filterbtn '+(taskФ.status===k?"on":"")+'" onclick="taskФ.status=\''+k+'\';renderPage(\'tasks\')">'+l+'</button>').join(""):"";

/* ---------- team notifications (fires the task webhook -> n8n -> Slack/email/etc) ---------- */
function notifyTask(event,t,extra){
  try{
    const cfg=db("integrationConfig",{webhooks:{}}); const url=(cfg.webhooks||{}).task||"";
    if(!url||!t) return;
    const payload={ event:event, at:nowISO(),
      by:(typeof sessionUser!=="undefined"&&sessionUser?sessionUser.name:""),
      task:{ id:t.id, title:t.title, status:t.status, priority:t.priority||"P3",
        assignee:t.assignee||"", collaborators:Array.isArray(t.collaborators)?t.collaborators:[],
        property:(t.property?propName(t.property):"Tropical Stays"), due:t.due||"", notes:t.notes||"" },
      tenant:(typeof CLOUD!=="undefined"?CLOUD.tenant:"tropical_stays"),
      url:(typeof location!=="undefined"?location.href:"") };
    if(extra) payload.change=extra;
    fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({kind:"task",at:nowISO(),payload:payload})}).catch(function(){});
  }catch(e){}
}
/* ---------- one-click calendar export: all dated tasks as one .ics ---------- */
function icsAllTasks(){
  const list=db("tasks",[]).filter(t=>t.due && t.status!=="done" && t.status!=="cancelled");
  if(!list.length){ toast("No dated open tasks to export."); return; }
  const clean=s=>String(s||"").replace(/[\r\n,;]/g," ");
  const ev=list.map(t=>{ const s=t.due.replace(/-/g,""); const e=dateAdd(t.due,1).replace(/-/g,"");
    const summ=clean("["+(t.priority||"P3")+"] "+(t.title||""));
    const desc=clean((t.assignee?"Owner: "+t.assignee+". ":"")+(t.property?propName(t.property)+". ":"")+(t.notes||""));
    return ["BEGIN:VEVENT","UID:"+t.id+"@tropicalstays","DTSTART;VALUE=DATE:"+s,"DTEND;VALUE=DATE:"+e,"SUMMARY:"+summ,"DESCRIPTION:"+desc,"END:VEVENT"].join("\r\n");
  });
  const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Tropical Stays//Ops Hub//EN","X-WR-CALNAME:Tropical Stays Tasks"].concat(ev).concat(["END:VCALENDAR"]).join("\r\n");
  const b=new Blob([ics],{type:"text/calendar"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="tropical-stays-tasks.ics"; a.click();
  toast(list.length+" tasks exported. Import into Google or Apple Calendar.");
}

function taskBoard(){
  const list=taskFilters(db("tasks",[]),true);
  let cols;

  else if(taskФ.group==="property"){ const keys=[...new Set(list.map(t=>t.property||"__c"))]; cols=keys.map(k=>[k,k==="__c"?"Tropical Stays":propName(k),t=>(t.property||"__c")===k]); }
  else if(taskФ.group==="priority"){ cols=["P1","P2","P3"].map(p=>[p,p,t=>(t.priority||"P3")===p]); }
  else { cols=TASK_STATUS.map(([k,l])=>[k,l,t=>(t.status||"open")===k]); }

    return '<div class="tcol"><div class="tcol-hd"><span>'+esc(label)+'</span><span class="chip">'+items.length+'</span></div><div class="tcol-bd">'
      +(items.length?items.map(t=>taskCard(t)).join(""):'<div class="acq-empty">empty</div>')+'</div></div>';

function taskCalendar(){
  const ym=taskФ.month||todayAU().slice(0,7);
  const list=taskFilters(db("tasks",[]),true).filter(t=>t.due);
  const byDay={}; list.forEach(t=>{ (byDay[t.due]=byDay[t.due]||[]).push(t); });
  const first=new Date(ym+"-01T00:00:00"); const y=first.getFullYear(), mo=first.getMonth();
  const start=new Date(first); start.setDate(1-((first.getDay()+6)%7)); // Monday-start
  const today=todayAU();
  const dow=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=>'<div class="cal-dow">'+d+'</div>').join("");
  let cells="";
  for(let i=0;i<42;i++){ const d=new Date(start); d.setDate(start.getDate()+i); const ymd=d.toISOString().slice(0,10); const inMo=d.getMonth()===mo;
    const items=(byDay[ymd]||[]).map(t=>'<div class="cal-task '+taskStatusTone(t.status)+'" draggable="true" ondragstart="taskDragStart(event,\''+t.id+'\')" onclick="openTask(\''+t.id+'\')" title="'+esc(t.title)+'">'+esc(t.title)+'</div>').join("");
    cells+='<div class="cal-cell'+(inMo?"":" out")+(ymd===today?" today":"")+'" ondragover="event.preventDefault()" ondrop="taskDrop(event,\''+ymd+'\')"><div class="cal-num">'+d.getDate()+'</div>'+items+'</div>';
  }
  const label=first.toLocaleString("en-AU",{month:"long",year:"numeric"});
  return '<div class="card tight" style="padding:12px">'
    +'<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><button class="btn ghost sm" onclick="taskMonth(-1)">Prev</button><div style="font-family:var(--disp);font-size:17px;min-width:150px;text-align:center">'+esc(label)+'</div><button class="btn ghost sm" onclick="taskMonth(1)">Next</button><button class="btn ghost sm" onclick="taskФ.month=\'\';renderPage(\'tasks\')">Today</button><span class="muted" style="font-size:11px;margin-left:auto">Drag a task to a day to reschedule</span></div>'
    +'<div class="cal-grid">'+dow+cells+'</div></div>';
}
function taskMonth(delta){ const ym=taskФ.month||todayAU().slice(0,7); const d=new Date(ym+"-01T00:00:00"); d.setMonth(d.getMonth()+delta); taskФ.month=d.toISOString().slice(0,7); renderPage("tasks"); }

function subSave(){
  const {taskId,subId}=subCtx; const list=db("tasks",[]); const t=list.find(x=>x.id===taskId); if(!t)return;
  const title=val("sb_title").trim(); if(!title){ toast("Subtask needs a title."); return; }
  t.subtasks=t.subtasks||[]; let newId=subId;
  const obj={title:title,assignee:val("sb_assignee"),due:val("sb_due")};

function updTarget(kind,taskId,subId){ const list=db("tasks",[]); const t=list.find(x=>x.id===taskId); if(!t)return null; if(kind==="sub"){ const s=(t.subtasks||[]).find(x=>x.id===subId); return s?{list:list,t:t,obj:s}:null; } return {list:list,t:t,obj:t}; }
function updatesComposer(kind,taskId,subId){ attachDraft["upd_att"]=[];
  return '<div class="updcompose"><textarea class="inp" id="upd_text" placeholder="Write an update, paste a link, or attach a photo..." style="min-height:56px"></textarea>'
    +'<div class="attach" id="upd_att">'+attachEditor("upd_att")+'</div>'
    +'<div style="margin-top:6px;text-align:right"><button class="btn sm" onclick="postUpdate(\''+kind+'\',\''+taskId+'\',\''+(subId||"")+'\')">Post update</button></div></div>';
}
function updatesFeed(kind,taskId,subId){ const tg=updTarget(kind,taskId,subId||null); if(!tg)return "";
  const ups=(tg.obj.updates||[]).slice().sort((a,b)=>(b.at||"").localeCompare(a.at||""));
  if(!ups.length) return '<div class="muted" style="font-size:12px">No updates yet. Post the first one to start the thread.</div>';
  return ups.map(u=>'<div class="upditem"><div class="updhd"><b>'+esc(u.who||"")+'</b><span class="mono">'+esc(timeShort(u.at))+'</span><button class="btn ghost sm" style="margin-left:auto" onclick="delUpdate(\''+kind+'\',\''+taskId+'\',\''+(subId||"")+'\',\''+u.id+'\')">Delete</button></div>'
    +(u.text?'<div class="updtext">'+esc(u.text).replace(/\n/g,"<br>")+'</div>':'')
    +(attachCount(u.attach)?'<div style="margin-top:6px">'+attachView(u.attach)+'</div>':'')+'</div>').join("");
}
function postUpdate(kind,taskId,subId){ const tg=updTarget(kind,taskId,subId||null); if(!tg)return;
  const text=(val("upd_text")||"").trim(); const att=attachClean(attachDraft["upd_att"]);

  tg.obj.updates=tg.obj.updates||[]; tg.obj.updates.push({id:uid("upd"),at:nowISO(),who:currentUserName(),text:text,attach:att});

}
function delUpdate(kind,taskId,subId,updId){ const tg=updTarget(kind,taskId,subId||null); if(!tg)return; tg.obj.updates=(tg.obj.updates||[]).filter(u=>u.id!==updId); tg.t.updated=nowISO(); save("tasks",tg.list); if(kind==="sub") openSubtask(taskId,subId); else openTask(taskId); }

function blockSave(){ const {secId,subId,blockId}=blkCtx; const list=getSections(); const s=list.find(x=>x.id===secId); const sub=s.subs.find(x=>x.id===subId); const b=sub.blocks.find(x=>x.id===blockId); if(!b)return;

function blockDelete(secId,subId,blockId){ const list=getSections(); const s=list.find(x=>x.id===secId); const sub=s.subs.find(x=>x.id===subId); sub.blocks=(sub.blocks||[]).filter(x=>x.id!==blockId); saveSections(list); renderPage("sec:"+secId); }
function blockCheckToggle(secId,subId,blockId,idx){ const list=getSections(); const s=list.find(x=>x.id===secId); const sub=s.subs.find(x=>x.id===subId); const b=sub.blocks.find(x=>x.id===blockId); if(!b||!b.items||!b.items[idx])return; b.items[idx].done=!b.items[idx].done; saveSections(list); renderPage("sec:"+secId); }
function blockMove(secId,subId,i,dir){ const list=getSections(); const s=list.find(x=>x.id===secId); const sub=s.subs.find(x=>x.id===subId); const arr=sub.blocks||[]; const j=i+dir; if(j<0||j>=arr.length)return; const t=arr[i]; arr[i]=arr[j]; arr[j]=t; saveSections(list); renderPage("sec:"+secId); }
function renderBlock(secId,subId,b,i){
  let inner="";

let propФ={q:"",suburb:"",status:"",pool:false,pet:false,attn:false};
/* ---------- user-defined custom fields (add Pet fee, etc. without HTML) ---------- */
const CUSTOM_STORES=new Set(["properties","contacts","tasks","maintenance","servicing","midstay","pipeline","resources","consumables","reviews"]);
const CF_TYPES=[["text","Text"],["number","Number"],["textarea","Long text"],["date","Date"],["checkbox","Yes / no"]];
function getCustomFields(store){ const o=db("customFields",{}); return Array.isArray(o[store])?o[store]:[]; }
function saveCustomFields(store,arr){ const o=db("customFields",{}); o[store]=arr; save("customFields",o); }
function slugKey(s){ return (s||"").toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"")||("f"+Math.random().toString(36).slice(2,6)); }
function customFieldInput(cf,cv){
  const id="cf_"+cf.key;
  if(cf.type==="number") return '<div class="field"><label>'+esc(cf.label)+'</label><input class="inp" id="'+id+'" type="number" value="'+esc(cv==null?"":cv)+'"></div>';
  if(cf.type==="textarea") return '<div class="field"><label>'+esc(cf.label)+'</label><textarea class="inp" id="'+id+'">'+esc(cv||"")+'</textarea></div>';
  if(cf.type==="date") return '<div class="field"><label>'+esc(cf.label)+'</label><input class="inp" id="'+id+'" type="date" value="'+esc(cv||"")+'"></div>';
  if(cf.type==="checkbox") return '<div class="field"><label class="chkline"><input type="checkbox" id="'+id+'" '+(cv?"checked":"")+'><span>'+esc(cf.label)+'</span></label></div>';
  return '<div class="field"><label>'+esc(cf.label)+'</label><input class="inp" id="'+id+'" value="'+esc(cv||"")+'"></div>';
}
function customFormBlock(store,rec){
  if(!CUSTOM_STORES.has(store)) return "";
  const cfs=getCustomFields(store); const cv=(rec&&rec.custom)||{};
  return '<div class="form-sec">Custom fields</div>'
    +(cfs.length?cfs.map(cf=>customFieldInput(cf,cv[cf.key])).join(""):'<div class="muted" style="font-size:12px;margin-bottom:6px">None yet. Add your own, like Pet fee or Council area.</div>')
    +'<button type="button" class="btn ghost sm" onclick="manageCustomFields(\''+store+'\')">Manage custom fields</button>';
}
function collectCustom(store,existing){
  if(!CUSTOM_STORES.has(store)) return undefined;
  const cfs=getCustomFields(store); const out=Object.assign({},existing||{});
  cfs.forEach(cf=>{ const el=document.getElementById("cf_"+cf.key); if(!el)return; out[cf.key]=cf.type==="checkbox"?el.checked:(cf.type==="number"?(el.value===""?null:Number(el.value)):el.value); });
  return out;
}
function manageCustomFields(store){
  const cfs=getCustomFields(store);
  const typeSel=sel=>'<select class="inp cf-type" style="max-width:110px">'+CF_TYPES.map(t=>'<option value="'+t[0]+'" '+(sel===t[0]?"selected":"")+'>'+t[1]+'</option>').join("")+'</select>';
  const row=cf=>'<div class="field cfrow" data-key="'+esc(cf.key)+'" style="display:flex;gap:6px;align-items:center;margin-bottom:6px"><input class="inp cf-label" value="'+esc(cf.label)+'" style="flex:1">'+typeSel(cf.type)+'<button type="button" class="btn ghost sm" onclick="this.closest(\'.cfrow\').remove()">Remove</button></div>';
  openModal("Custom fields for "+(COLLECTIONS[store]?COLLECTIONS[store].singular.toLowerCase():store),
    '<div id="cfEdit">'+cfs.map(row).join("")+'</div><button type="button" class="btn ghost sm" onclick="cfAddRow()">Add field</button><div class="note">Fields you add here appear on every '+(COLLECTIONS[store]?COLLECTIONS[store].singular.toLowerCase():"record")+' form and detail, and in bulk edit. Existing values are kept if you rename the label.</div>',
    '<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="cfSave(\''+store+'\')">Save fields</button>');
}
function cfAddRow(){ const box=document.getElementById("cfEdit"); const d=document.createElement("div"); d.className="field cfrow"; d.style.cssText="display:flex;gap:6px;align-items:center;margin-bottom:6px"; d.innerHTML='<input class="inp cf-label" placeholder="Field name, e.g. Pet fee" style="flex:1"><select class="inp cf-type" style="max-width:110px">'+CF_TYPES.map(t=>'<option value="'+t[0]+'">'+t[1]+'</option>').join("")+'</select><button type="button" class="btn ghost sm" onclick="this.closest(\'.cfrow\').remove()">Remove</button>'; box.appendChild(d); }
function cfSave(store){
  const seen=[];
  const out=[...document.querySelectorAll("#cfEdit .cfrow")].map(r=>{
    const label=r.querySelector(".cf-label").value.trim(); if(!label)return null;
    const type=r.querySelector(".cf-type").value;
    let key=r.getAttribute("data-key");
    if(!key){ key=slugKey(label); let base=key,i=2; while(seen.indexOf(key)>=0){ key=base+"_"+i; i++; } }
    seen.push(key);
    return {key:key,label:label,type:type};
  }).filter(Boolean);
  saveCustomFields(store,out); closeModal(); toast("Custom fields saved."); renderPage(currentTab);
}

/* ---------- bulk edit for properties ---------- */
function bulkEdit(){
  const list=props();
  const rows=list.map(p=>'<label class="chkline" style="display:flex;gap:8px;padding:3px 2px"><input type="checkbox" data-bp="'+p.id+'"><span>'+esc(p.nickname)+'</span></label>').join("");
  const cfs=getCustomFields("properties");
  const fieldOpts='<option value="tagAdd">Add tag</option><option value="tagRemove">Remove tag</option><option value="status">Set status</option><option value="cluster">Set cluster</option><option value="owner">Set owner</option>'
    +cfs.map(f=>'<option value="cf:'+f.key+'">Set '+esc(f.label)+'</option>').join("")
    +'<option value="delete">Delete selected</option>';
  openModal("Bulk edit properties",
    '<div style="display:flex;gap:8px;margin-bottom:8px"><button type="button" class="btn ghost sm" onclick="bulkAll(true)">Select all</button><button type="button" class="btn ghost sm" onclick="bulkAll(false)">Clear</button><span class="muted" id="bulkCount" style="font-size:12px;align-self:center;margin-left:auto"></span></div>'
    +'<div style="max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:var(--r);padding:8px;margin-bottom:12px" onclick="bulkCount()">'+rows+'</div>'
    +'<div class="field"><label>Action</label><select class="inp" id="bulkAction" onchange="bulkValueField()">'+fieldOpts+'</select></div>'
    +'<div id="bulkValueWrap"></div>',
    '<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="bulkApply()">Apply</button>');
  setTimeout(()=>{bulkValueField();bulkCount();},20);
}
function bulkAll(on){ document.querySelectorAll("[data-bp]").forEach(c=>c.checked=on); bulkCount(); }
function bulkCount(){ const n=[...document.querySelectorAll("[data-bp]")].filter(c=>c.checked).length; const el=document.getElementById("bulkCount"); if(el) el.textContent=n+" selected"; }
function bulkValueField(){ const a=val("bulkAction"); const w=document.getElementById("bulkValueWrap"); if(!w)return;
  if(a==="delete"){ w.innerHTML='<div class="note" style="color:var(--alert)">This permanently removes the selected properties. It cannot be undone.</div>'; return; }
  if(a==="status"){ w.innerHTML='<div class="field"><label>Value</label><select class="inp" id="bulkVal">'+["Active","Onboarding","Inactive"].map(o=>'<option>'+o+'</option>').join("")+'</select></div>'; return; }
  const cfs=getCustomFields("properties"); const cf=a.indexOf("cf:")===0?cfs.find(f=>f.key===a.slice(3)):null;
  if(cf&&cf.type==="checkbox"){ w.innerHTML='<div class="field"><label class="chkline"><input type="checkbox" id="bulkVal"><span>'+esc(cf.label)+'</span></label></div>'; return; }
  w.innerHTML='<div class="field"><label>Value</label><input class="inp" id="bulkVal" '+(cf&&cf.type==="number"?'type="number"':'')+' placeholder="'+(a==="tagAdd"||a==="tagRemove"?"tag":"value")+'"></div>';
}
function bulkApply(){
  const ids=[...document.querySelectorAll("[data-bp]")].filter(c=>c.checked).map(c=>c.getAttribute("data-bp"));
  if(!ids.length){ toast("Select at least one property."); return; }
  const a=val("bulkAction"); const vEl=document.getElementById("bulkVal");
  const value=vEl?(vEl.type==="checkbox"?vEl.checked:vEl.value.trim()):"";
  let list=db("properties",[]);
  if(a==="delete"){ save("properties",list.filter(p=>ids.indexOf(p.id)<0)); logAct("delete","properties",ids.length+" properties (bulk)"); closeModal(); toast(ids.length+" deleted."); renderPage("props"); return; }
  if((a==="tagAdd"||a==="tagRemove"||a==="cluster"||a==="owner")&&value===""){ toast("Enter a value."); return; }
  list.forEach(p=>{ if(ids.indexOf(p.id)<0)return;
    if(a==="tagAdd"){ p.tags=Array.isArray(p.tags)?p.tags:[]; if(p.tags.indexOf(value)<0)p.tags.push(value); }
    else if(a==="tagRemove"){ p.tags=(Array.isArray(p.tags)?p.tags:[]).filter(t=>t!==value); }
    else if(a==="status") p.status=value;
    else if(a==="cluster") p.cluster=value;
    else if(a==="owner") p.owner=value;
    else if(a.indexOf("cf:")===0){ p.custom=p.custom||{}; p.custom[a.slice(3)]=value; }
    p.updated=nowISO();
  });
  save("properties",list); logAct("edit","properties",ids.length+" properties (bulk "+a+")"); closeModal(); toast(ids.length+" updated."); renderPage("props");
}

function propApplies(item,p){
  if(Array.isArray(item.scope)&&item.scope.length){ return item.scope.indexOf(p.id)>=0; }
  const a=(item.applies||"All").trim().toLowerCase();
  if(a===""||a==="all") return true;
  if(a==="pool homes") return !!p.pool;
  if(a==="standalone houses") return !p.cluster;
  if(p.cluster && a.indexOf(p.cluster.toLowerCase())>=0) return true;
  if(p.suburb && a.indexOf(p.suburb.toLowerCase())>=0) return true;
  return false;
}

function yes(v){ if(v===true) return true; if(v==null||v===false) return false; const s=String(v).trim().toLowerCase(); return s!==""&&s!=="no"&&s!=="na"&&s!=="n/a"&&s!=="none"&&s!=="false"; }
function propFeatures(p){

  if(yes(p.crib)) out.push({k:"crib",label:"Cot"});

function cityOf(p){
  if(p.suburb&&String(p.suburb).trim()) return p.suburb.trim();

  const m=a.match(/,\s*([A-Za-z][A-Za-z\s]+?)\s+QLD/); if(m) return m[1].trim();
  const parts=a.split(",").map(s=>s.trim()).filter(Boolean);
  return parts.length>=2?parts[parts.length-2].replace(/\s+QLD.*$/i,"").trim():"";

      +'<div class="rowact" style="margin-top:8px"><button class="btn ghost sm" onclick="openForm(\'pipeline\',\''+x.id+'\')">Edit</button> <button class="btn ghost sm" onclick="delRow(\'pipeline\',\''+x.id+'\')">Del</button></div>'
      +'</div>').join("");
    return '<div class="acq-col"><div class="acq-head"><span>'+st+'</span><span class="chip">'+items.length+'</span>'
      +'<button class="btn ghost sm" style="margin-left:auto" onclick="openForm(\'pipeline\',null,{stage:\''+st+'\'})">Add</button></div>'
      +(cards||'<div class="acq-empty">Nothing here yet</div>')+'</div>';
  };
  return head("Acquisition, onboarding, offboarding","Property acquisition",
      "Track each property through the lifecycle. Owner retention outranks everything, so keep onboarding warm and offboarding clean.")
    +'<div class="acq-board">'+stages.map(col).join("")+'</div>';
}

/* ============================================================
   FAQ KNOWLEDGE HUB  (card grid + filters + log-FAQ modal)
   Data: db("faqs") = [{id, applies, category, question, answer}]
   ============================================================ */
let faqState={view:"cards",prop:"",cat:"",q:""};
let faqDraft=null;
const FAQ_KNOWN_PROPS=[["All","All Properties (Universal)","Applies across every listing"],["Cairns One","Cairns One","Property specific rule"],["Standalone houses","Standalone houses","Property specific rule"],["Pool homes","Pool homes","Property specific rule"],["Harbour Lights","Harbour Lights","Property specific rule"]];
const FAQ_MOD_CATS=["Access","Housekeeping","Luggage","Timing","Parking","Pool","Payment","Maintenance"];
const FAQ_CAT_COLORS={"Access":["#1f7a52","rgba(31,157,87,.12)"],"Housekeeping":["#7c3aed","rgba(124,58,237,.12)"],"Luggage":["#a16207","rgba(161,98,7,.12)"],"Timing":["#475569","rgba(71,85,105,.12)"],"Parking":["#2563eb","rgba(37,99,235,.12)"],"Pool":["#0891b2","rgba(8,145,178,.12)"],"Payment":["#dc2626","rgba(220,38,38,.12)"],"Maintenance":["#d97706","rgba(217,119,6,.12)"],"Amenities":["#0d9488","rgba(13,148,136,.12)"],"Check-in":["#2563eb","rgba(37,99,235,.12)"],"Check-out":["#7c3aed","rgba(124,58,237,.12)"],"Wifi":["#0891b2","rgba(8,145,178,.12)"],"General":["#6b7280","rgba(107,114,128,.12)"]};
function faqCatColor(c){ return FAQ_CAT_COLORS[c]||["#6b7280","rgba(107,114,128,.12)"]; }
function faqStyle(){ return '<style>'
  +'.faqgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}'
  +'.faqcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:15px;display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(17,26,36,.04)}'
  +'.faqcard .tags{display:flex;justify-content:space-between;gap:8px;margin-bottom:10px}'
  +'.faqtag{font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:20px;border:1px solid transparent;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}'
  +'.faqcard h4{font-size:14px;font-weight:600;margin:0 0 7px;line-height:1.3;color:var(--ink)}'
  +'.faqcard .ans{font-size:12.5px;color:var(--ink2);line-height:1.5;flex:1;white-space:pre-wrap}'
  +'.faqcard .foot{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}'
  +'.faqcopy{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--dgreen);background:var(--sage-l);border:1px solid var(--sage-b);border-radius:var(--r);padding:6px 11px;cursor:pointer}'
  +'.faqcopy:hover{background:var(--ok-l)}'
  +'.faqact{margin-left:auto;display:flex;gap:4px}'
  +'.faqact button{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:11.5px;padding:4px 6px;border-radius:6px}'
  +'.faqact button:hover{color:var(--ink);background:var(--bg)}'
  +'.faqfilters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}'
  +'.faqchip{font-size:11.5px;padding:5px 11px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink2);cursor:pointer;white-space:nowrap}'
  +'.faqchip.on{background:var(--dgreen);color:#fff;border-color:var(--dgreen)}'
  +'.faqlbl{font:9px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:2px}'
  +'.faqrgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}'
  +'.faqradio{display:flex;gap:10px;align-items:center;padding:12px 13px;border:1.5px solid var(--line);border-radius:var(--r2);cursor:pointer}'
  +'.faqradio.on{border-color:var(--dgreen);background:var(--sage-l)}'
  +'.faqradio .rt{font-weight:600;color:var(--ink);font-size:13px}'
  +'.faqradio .rs{font-size:11px;color:var(--muted)}'
  +'.faqmodchip{font-size:12px;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink2);cursor:pointer}'
  +'.faqmodchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}'
  +'@media(max-width:600px){.faqgrid{grid-template-columns:1fr}.faqrgrid{grid-template-columns:1fr}}'
  +'</style>'; }

function faqAppliesList(){ const groups=new Set(),specifics=new Set(); db("faqs",[]).forEach(f=>{ if(f.applies&&f.applies!=="All")groups.add(f.applies); (Array.isArray(f.scope)?f.scope:[]).forEach(id=>{ const nm=propName(id); if(nm&&nm!=="-")specifics.add(nm); }); }); return {groups:[...groups].sort(),specifics:[...specifics].sort()}; }
function faqCatsList(){ const s=new Set(); db("faqs",[]).forEach(f=>{ if(f.category) s.add(f.category); }); return [...s].sort(); }
function faqFiltered(){
  const q=(faqState.q||"").toLowerCase(); const pf=faqState.prop;
  return db("faqs",[]).filter(f=>{
    if(pf){ const names=(Array.isArray(f.scope)?f.scope:[]).map(id=>propName(id)); if(!(f.applies===pf||f.applies==="All"||names.indexOf(pf)>=0)) return false; }
    if(faqState.cat && f.category!==faqState.cat) return false;
    if(q && ((f.question||"")+" "+(f.answer||"")+" "+(f.category||"")+" "+(f.applies||"")).toLowerCase().indexOf(q)<0) return false;
    return true;
  });
}
function faqSetView(v){ faqState.view=v; renderPage("faqs"); }
function faqSetProp(p){ faqState.prop=p; renderPage("faqs"); }
function faqSetCat(c){ faqState.cat=c; renderPage("faqs"); }

function faqCard(f){
  const pc=faqCatColor(f.category); const scope=Array.isArray(f.scope)?f.scope:[];
  let left;
  if(scope.length){
    left=scope.slice(0,2).map(id=>'<span class="faqtag" style="color:var(--ink2);background:var(--bg);border-color:var(--line)">'+esc(propName(id))+'</span>').join("")
      +(scope.length>2?'<span class="faqtag" style="color:var(--muted);background:var(--bg);border-color:var(--line)">+'+(scope.length-2)+'</span>':"");
  } else {
    left=f.applies==="All"
      ? '<span class="faqtag" style="color:var(--dgreen);background:var(--sage-l);border-color:var(--sage-b)">All Properties</span>'
      : '<span class="faqtag" style="color:var(--ink2);background:var(--bg);border-color:var(--line)">'+esc(f.applies||"Property")+'</span>';
  }
  const catTag='<span class="faqtag" style="color:'+pc[0]+';background:'+pc[1]+'">'+esc(f.category||"General")+'</span>';
  return '<div class="faqcard">'
    +'<div class="tags"><div style="display:flex;gap:5px;flex-wrap:wrap">'+left+'</div>'+catTag+'</div>'
    +'<h4>'+esc(f.question||"")+'</h4>'
    +'<div class="ans">'+esc(f.answer||"")+'</div>'
    +'<div class="foot"><button class="faqcopy" onclick="faqCopy(\''+f.id+'\')">Copy answer</button>'
      +'<span class="faqact"><button title="Edit" onclick="faqForm(\''+f.id+'\')">Edit</button><button title="Delete" onclick="faqDelete(\''+f.id+'\')">Delete</button></span></div>'
    +'</div>';
}
function faqByCat(list){
  const g={}; list.forEach(f=>{ const c=f.category||"General"; (g[c]=g[c]||[]).push(f); });
  return Object.keys(g).sort().map(cat=>{ const pc=faqCatColor(cat);
    return '<div style="margin-bottom:18px"><div class="sechd"><h3 style="color:'+pc[0]+'">'+esc(cat)+'</h3><span class="ct">'+g[cat].length+'</span></div><div class="faqgrid">'+g[cat].map(faqCard).join("")+'</div></div>';
  }).join("");
}
function faqSheet(list){
  const rows=list.map(f=>'<tr>'
    +'<td>'+(f.applies==="All"?'<span class="chip sage">All</span>':'<span class="chip">'+esc(f.applies||"")+'</span>')+'</td>'
    +'<td><span class="chip">'+esc(f.category||"")+'</span></td>'
    +'<td><b>'+esc(f.question||"")+'</b></td><td class="muted">'+esc(f.answer||"")+'</td>'
    +'<td style="white-space:nowrap"><button class="btn ghost sm" onclick="faqCopy(\''+f.id+'\')">Copy</button> <button class="btn ghost sm" onclick="faqForm(\''+f.id+'\')">Edit</button></td></tr>').join("");
  return '<div class="card tight"><div class="wrap"><table class="tbl"><thead><tr><th>Property</th><th>Category</th><th>Question</th><th>Answer</th><th>Actions</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}
function faqCopy(id){ const f=db("faqs",[]).find(x=>x.id===id); if(f) copyText(f.answer||"","Answer copied for guest chat."); }

function viewFaqs(){
  const all=db("faqs",[]);
  const total=all.length, univ=all.filter(f=>f.applies==="All").length, spec=total-univ;
  const cats=faqCatsList(); const shown=faqFiltered();
  const strip='<div class="kpis">'
    +kpi("Total FAQs",total,"knowledge entries",true)
    +kpi("All properties",univ,"universal rules")
    +kpi("Property specific",spec,"tied to a group")
    +kpi("Categories",cats.length,"topics covered")
    +'</div>';
  const toolbar='<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px">'
    +'<input class="inp" style="flex:1;min-width:200px" placeholder="Search a question, keyword, category..." value="'+esc(faqState.q)+'" oninput="faqState.q=this.value;renderPage(\'faqs\')">'
    +viewSeg(faqState.view,[["cards","Cards"],["category","By category"],["sheet","Data sheet"]],"faqSetView")
    +'<button class="btn sm" onclick="faqForm()">Log FAQ</button></div>';
  const pa=faqAppliesList();
  const propChips='<div class="faqfilters"><span class="faqlbl">Property</span>'
    +'<span class="faqchip'+(faqState.prop===""?" on":"")+'" onclick="faqSetProp(\'\')">All properties</span>'
    +pa.groups.map(a=>'<span class="faqchip'+(faqState.prop===a?" on":"")+'" onclick="faqSetProp(\''+esc(a)+'\')">'+esc(a)+'</span>').join("")
    +pa.specifics.map(a=>'<span class="faqchip'+(faqState.prop===a?" on":"")+'" onclick="faqSetProp(\''+esc(a)+'\')" title="Specific property">'+esc(a)+'</span>').join("")+'</div>';
  const catChips='<div class="faqfilters"><span class="faqlbl">Category</span>'
    +'<span class="faqchip'+(faqState.cat===""?" on":"")+'" onclick="faqSetCat(\'\')">All</span>'
    +cats.map(c=>'<span class="faqchip'+(faqState.cat===c?" on":"")+'" onclick="faqSetCat(\''+esc(c)+'\')">'+esc(c)+'</span>').join("")+'</div>';
  let body;
  if(!shown.length){ body='<div class="card"><div class="empty"><h4>No FAQs match</h4><p>Clear the filters, or log a new entry.</p></div></div>'; }
  else if(faqState.view==="sheet"){ body=faqSheet(shown); }
  else if(faqState.view==="category"){ body=faqByCat(shown); }
  else { body='<div class="faqgrid">'+shown.map(faqCard).join("")+'</div>'; }
  return faqStyle()
    +head("Instant guest answers, property rules, citations","FAQs & Knowledge Hub","Click any answer to copy it for guest chat or email. Everything here saves and syncs to the team.")
    +strip+toolbar+propChips+catChips
    +'<div class="muted" style="font-size:11px;margin:2px 0 12px">Showing '+shown.length+' of '+total+' FAQs</div>'
    +body;
}

/* ---------- log / edit FAQ modal ---------- */
function faqForm(id){
  if(!requireEdit("faqs"))return;
  const ex=id?db("faqs",[]).find(x=>x.id===id):null;
  faqDraft={id:ex?ex.id:null,applies:ex?(ex.applies||"All"):"All",category:ex?(ex.category||"Access"):"Access",question:ex?(ex.question||""):"",answer:ex?(ex.answer||""):"",other:"",scope:(ex&&Array.isArray(ex.scope))?ex.scope.slice():[]};
  const known=FAQ_KNOWN_PROPS.map(k=>k[0]);
  if(faqDraft.applies && known.indexOf(faqDraft.applies)<0){ faqDraft.other=faqDraft.applies; faqDraft.applies=""; }
  faqModalRender();
}
function faqSync(){
  if(!faqDraft) return;
  const q=document.getElementById("faq_q"), a=document.getElementById("faq_a"), o=document.getElementById("faq_other");
  if(q) faqDraft.question=q.value;
  if(a) faqDraft.answer=a.value;
  if(o) faqDraft.other=o.value;
}
function faqPick(field,val){ faqSync(); faqDraft[field]=val; if(field==="applies") faqDraft.other=""; faqModalRender(); }
function faqInsert(kind){ faqSync(); const a=document.getElementById("faq_a"); if(!a)return; a.value=(a.value||"")+(kind==="link"?" https://":" [Photo: https://...]"); faqDraft.answer=a.value; a.focus(); }
function faqScopeToggle(id,on){ if(!faqDraft)return; faqDraft.scope=Array.isArray(faqDraft.scope)?faqDraft.scope:[]; const i=faqDraft.scope.indexOf(id); if(on&&i<0)faqDraft.scope.push(id); if(!on&&i>=0)faqDraft.scope.splice(i,1); }
function faqScopeFilter(v){ v=(v||"").toLowerCase(); const box=document.getElementById("faqScope"); if(!box)return; box.querySelectorAll(".scoperow").forEach(r=>{ r.style.display=(!v||(r.dataset.name||"").indexOf(v)>=0)?"":"none"; }); }
function faqModalRender(){
  const d=faqDraft;
  const radios=FAQ_KNOWN_PROPS.map(k=>'<div class="faqradio'+((!d.other&&d.applies===k[0])?" on":"")+'" onclick="faqPick(\'applies\',\''+k[0]+'\')"><div><div class="rt">'+esc(k[1])+'</div><div class="rs">'+esc(k[2])+'</div></div></div>').join("");
  const chips=FAQ_MOD_CATS.map(c=>'<span class="faqmodchip'+(d.category===c?" on":"")+'" onclick="faqPick(\'category\',\''+c+'\')">'+esc(c)+'</span>').join("");
  const body=faqStyle()
    +'<div class="faqlbl" style="display:block;margin-bottom:7px">Applies to property</div>'
    +'<div class="faqrgrid">'+radios+'</div>'
    +'<input class="inp" id="faq_other" placeholder="Or type another property name" value="'+esc(d.other||"")+'" oninput="faqDraft.other=this.value" style="margin-bottom:10px">'
    +'<div class="faqlbl" style="display:block;margin-bottom:6px">Or tag specific properties (optional)</div>'
    +'<input class="inp" placeholder="Filter properties" oninput="faqScopeFilter(this.value)" style="margin-bottom:6px">'
    +'<div id="faqScope" class="scope-list" style="max-height:170px;overflow:auto;border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;margin-bottom:14px">'
    +props().slice().sort((a,b)=>a.nickname.localeCompare(b.nickname)).map(p=>'<label class="chkline scoperow" data-name="'+esc(p.nickname.toLowerCase())+'"><input type="checkbox" '+((Array.isArray(d.scope)&&d.scope.indexOf(p.id)>=0)?"checked":"")+' onchange="faqScopeToggle(\''+p.id+'\',this.checked)"><span>'+esc(p.nickname)+'</span></label>').join("")
    +'</div>'
    +'<div class="faqlbl" style="display:block;margin-bottom:7px">Category</div>'
    +'<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px">'+chips+'</div>'
    +'<div class="field"><label>Question</label><input class="inp" id="faq_q" placeholder="e.g. How do we access the gated garage?" value="'+esc(d.question||"")+'"></div>'
    +'<div class="field"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px"><label style="margin:0">Answer (text, links, or photos)</label>'
      +'<span><button class="btn ghost sm" onclick="faqInsert(\'link\')">+ Link</button> <button class="btn ghost sm" onclick="faqInsert(\'photo\')">+ Photo</button></span></div>'
      +'<textarea class="inp" id="faq_a" style="min-height:110px" placeholder="Clear, concise instructions for the guest. Paste URLs or insert a [Photo: URL] tag.">'+esc(d.answer||"")+'</textarea></div>';
  const foot=(d.id?'<button class="btn ghost" style="margin-right:auto;color:var(--alert)" onclick="faqDelete(\''+d.id+'\')">Delete</button>':"")
    +'<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="faqSave()">'+(d.id?"Save changes":"Add FAQ")+'</button>';
  openModal(d.id?"Edit FAQ entry":"Log new FAQ entry",body,foot);
}
function faqSave(){
  faqSync(); const d=faqDraft; if(!d) return;
  const applies=(d.other&&d.other.trim())?d.other.trim():d.applies;
  const q=(d.question||"").trim(), a=(d.answer||"").trim();
  if(!applies){ toast("Pick a property or type one."); return; }
  if(!q){ toast("Add a question."); return; }
  if(!a){ toast("Add an answer."); return; }
  const list=db("faqs",[]);
  const scope=Array.isArray(d.scope)?d.scope:[];
  if(d.id){ const f=list.find(x=>x.id===d.id); if(f){ f.applies=applies; f.category=d.category; f.question=q; f.answer=a; f.scope=scope; f.updated=nowISO(); } }
  else { list.push({id:uid("faq"),applies:applies,category:d.category,question:q,answer:a,scope:scope,created:nowISO(),updated:nowISO()}); }
  save("faqs",list); faqDraft=null; closeModal(); renderPage("faqs"); toast("FAQ saved.");
}
function faqDelete(id){
  if(!requireEdit("faqs"))return;
  save("faqs",db("faqs",[]).filter(x=>x.id!==id)); faqDraft=null; closeModal(); renderPage("faqs"); toast("FAQ removed.");
}

function viewGeneric(store){

    workflows:["Workflows","Automations and triggers","Trigger to action mapping. Native Guesty or SuiteOp first, then n8n, then Apps Script, then manual.",[["trigger","Trigger"],["action","Action"],["tool","Tool"],["notes","Notes"]]],
    guestComms:["Guest comms","Templates and macros","Warm, direct, Australian English. Keep it personal, not a corporate portal. These are seeded from your real message history, codes stripped out.",[["name","Name"],["channel","Channel"],["template","Template"]]],
    quickReplies:["Quick replies","Canned answers","Short answers to the questions guests ask most, tagged to the properties they apply to. Property codes live in the property record, not here.",[["applies","Applies to"],["category","Category"],["title","Trigger"]]],
    faqs:["FAQs","Guest-facing answers","The recurring guest questions from your inbox, each tagged to where it applies.",[["applies","Applies to"],["category","Category"],["question","Question"]]],
    resources:["Resources","Links and tools","Reference locations for the team. Labels and notes only, no live credentials.",[["name","Name"],["type","Type"],["url","Location"],["notes","Notes"]]],
    reviews:["Reviews","Guest reviews and responses","Respond within 48 hours of checkout. Log the response so the team stays consistent.",[["property","Property"],["guest","Guest"],["rating","Rating"],["channel","Channel"]]]}[store];
