/* ---------- reusable attachment / link component (Drive-first, link-based) ---------- */
const ATTACH_KINDS={drive:"Google Drive",link:"External link",doc:"Document",photo:"Photo"};
let attachDraft={};
function attachInit(id,val){ attachDraft[id]=(Array.isArray(val)?val:[]).map(a=>Object.assign({},a)); }
function attachEditor(id){
  const arr=attachDraft[id]||[];
  const rows=arr.map((a,idx)=>{
    const isData=a.kind==="photo"&&/^data:/.test(a.url||"");
    return '<div class="atrow"><span class="atkind '+esc(a.kind)+'">'+esc(ATTACH_KINDS[a.kind]||a.kind)+'</span>'
      +(isData?'<span class="atthumb"><img src="'+esc(a.url)+'" alt=""></span><span class="muted" style="font-size:11px;flex:1">uploaded image (local)</span>'
             :'<input class="inp" placeholder="'+(a.kind==="drive"?"https://drive.google.com/...":"https://...")+'" value="'+esc(a.url||"")+'" oninput="attachSet(\''+id+'\','+idx+',\'url\',this.value)" style="flex:1;min-width:110px">')
      +'<input class="inp" placeholder="Caption" value="'+esc(a.caption||"")+'" oninput="attachSet(\''+id+'\','+idx+',\'caption\',this.value)" style="max-width:140px">'
      +'<button type="button" class="btn ghost sm" onclick="attachRemove(\''+id+'\','+idx+')">Remove</button></div>';
  }).join("");
  return '<div class="attach-list">'+rows+'</div>'
    +'<div class="attach-tools">'
    +'<button type="button" class="btn ghost sm" onclick="attachAdd(\''+id+'\',\'drive\')">+ Google Drive</button>'
    +'<button type="button" class="btn ghost sm" onclick="attachAdd(\''+id+'\',\'link\')">+ Link</button>'
    +'<button type="button" class="btn ghost sm" onclick="attachAdd(\''+id+'\',\'doc\')">+ Document</button>'
    +'<button type="button" class="btn ghost sm" onclick="attachAdd(\''+id+'\',\'photo\')">+ Photo URL</button>'
    +'<label class="btn ghost sm" style="cursor:pointer;margin:0">Upload photo<input type="file" accept="image/*" style="display:none" onchange="attachUpload(\''+id+'\',this)"></label>'
    +'</div>';
}
function attachRerender(id){ const wrap=document.getElementById(id); if(wrap) wrap.innerHTML=attachEditor(id); }
function attachAdd(id,kind){ (attachDraft[id]=attachDraft[id]||[]).push({id:uid("att"),kind:kind,url:"",caption:""}); attachRerender(id); }
function attachRemove(id,idx){ if(attachDraft[id]){ attachDraft[id].splice(idx,1); attachRerender(id); } }
function attachSet(id,idx,field,v){ if(attachDraft[id]&&attachDraft[id][idx]) attachDraft[id][idx][field]=v; }
function attachUpload(id,input){
  const f=input.files&&input.files[0]; if(!f)return;
  if(!/^image\//.test(f.type)){ toast("Only images upload directly. Use a Google Drive link for documents."); input.value=""; return; }
  if(f.size>700*1024){ toast("Image over 700KB. Put it in Google Drive and paste the link, it keeps the hub fast and shareable."); input.value=""; return; }
  const rd=new FileReader();
  rd.onload=()=>{ (attachDraft[id]=attachDraft[id]||[]).push({id:uid("att"),kind:"photo",url:rd.result,caption:f.name}); attachRerender(id); };
  rd.readAsDataURL(f); input.value="";
}
function attachClean(arr){ return (Array.isArray(arr)?arr:[]).filter(a=>a&&(a.url||"").trim()).map(a=>({id:a.id||uid("att"),kind:a.kind||"link",url:(a.url||"").trim(),caption:(a.caption||"").trim()})); }
function attachView(arr,emptyMsg){
  const items=Array.isArray(arr)?arr:[]; if(!items.length) return emptyMsg||"";
  const photos=items.filter(a=>a.kind==="photo"), links=items.filter(a=>a.kind!=="photo");
  let h="";
  if(photos.length) h+='<div class="refgrid">'+photos.map(a=>'<a class="refph" href="'+esc(a.url)+'" target="_blank" rel="noopener"><img src="'+esc(a.url)+'" alt="'+esc(a.caption||"")+'" loading="lazy"><span>'+esc(a.caption||"photo")+'</span></a>').join("")+'</div>';
  if(links.length) h+='<div class="atlinks">'+links.map(a=>{ const lbl=a.kind==="drive"?"Open in Google Drive":a.kind==="doc"?"Open document":"Open link"; return '<a class="atlink '+esc(a.kind)+'" href="'+esc(a.url)+'" target="_blank" rel="noopener"><b>'+esc(a.caption||lbl)+'</b><span>'+lbl+'</span></a>'; }).join("")+'</div>';
  return h;
}
function attachCount(arr){ return Array.isArray(arr)?arr.length:0; }
function attachEmailLines(arr){
  const items=Array.isArray(arr)?arr:[]; const out=[];
  items.filter(a=>a.kind==="drive").forEach(a=>out.push("Google Drive: "+(a.caption?a.caption+" - ":"")+a.url));
  items.filter(a=>a.kind==="doc").forEach(a=>out.push("Document: "+(a.caption?a.caption+" - ":"")+a.url));
  items.filter(a=>a.kind==="link").forEach(a=>out.push("Link: "+(a.caption?a.caption+" - ":"")+a.url));
  items.filter(a=>a.kind==="photo").forEach(a=>out.push(/^data:/.test(a.url)?("Photo attached from inbox: "+(a.caption||"image")):("Photo: "+(a.caption?a.caption+" - ":"")+a.url)));
  return out;
}
function fieldInput(f,val){
  const [n,l,t,opts,ph]=f; const id="f_"+n; const v=val==null?"":val;
  if(t==="textarea") return '<textarea class="inp" id="'+id+'" placeholder="'+esc(ph||"")+'">'+esc(v)+'</textarea>';
  if(t==="number") return '<input class="inp" id="'+id+'" type="number" value="'+esc(v)+'">';
  if(t==="date") return '<input class="inp" id="'+id+'" type="date" value="'+esc(v)+'">';
  if(t==="checkbox") return '<label class="chkline"><input type="checkbox" id="'+id+'" '+(v?"checked":"")+'><span>'+esc(l)+'</span></label>';
  if(t==="select") return '<select class="inp" id="'+id+'">'+editableOptions(editCtx.store,n,opts).map(o=>'<option '+(String(v)===o?"selected":"")+'>'+esc(o)+'</option>').join("")+'</select>';
  if(t==="propref") return '<select class="inp" id="'+id+'"><option value="">Tropical Stays (company)</option>'+props().map(p=>'<option value="'+p.id+'" '+(v===p.id?"selected":"")+'>'+esc(p.nickname)+'</option>').join("")+'</select>';
  if(t==="url") return '<input class="inp" id="'+id+'" type="url" value="'+esc(v)+'" placeholder="'+esc(ph||"https://")+'">';
  if(t==="checkboxes"){
    const chosen=Array.isArray(v)?v:[];
    return '<div class="cbxset" id="'+id+'">'+(opts||"").split("|").filter(Boolean).map(o=>
      '<label class="chkline"><input type="checkbox" data-cbx="'+esc(o)+'" '+(chosen.indexOf(o)>=0?"checked":"")+'><span>'+esc(o)+'</span></label>').join("")+'</div>';
  }
  if(t==="people"){
    const names=contactNames();
    return '<input class="inp" id="'+id+'" value="'+esc(v)+'" placeholder="'+esc(ph||"Name")+'" list="dl_'+esc(n)+'"><datalist id="dl_'+esc(n)+'">'+names.map(nm=>'<option value="'+esc(nm)+'"></option>').join("")+'</datalist>';
  }
  if(t==="peoplemulti"){
    const chosen=Array.isArray(v)?v:[]; const names=contactNames();
    if(!names.length) return '<div class="cbxset" id="'+id+'"><span class="muted" style="font-size:11px">No contacts yet. Add people under Contacts, then assign them here.</span></div>';
    return '<div class="cbxset" id="'+id+'">'+names.map(nm=>'<label class="chkline"><input type="checkbox" data-cbx="'+esc(nm)+'" '+(chosen.indexOf(nm)>=0?"checked":"")+'><span>'+esc(nm)+'</span></label>').join("")+'</div>';
  }
  if(t==="attach"){ attachInit(id, v); return '<div class="attach" id="'+id+'">'+attachEditor(id)+'</div>'; }
  if(t==="photolist"){
    const arr=Array.isArray(v)?v:[];
    const txt=arr.map(x=>x.caption?x.url+" | "+x.caption:x.url).join("\n");
    return '<textarea class="inp" id="'+id+'" placeholder="One per line:  https://image-url | caption  (e.g. modem location, breaker box)" style="min-height:96px">'+esc(txt)+'</textarea>';
  }
  if(t==="propscope"){
    const scope=Array.isArray(v)?v:[];
    const allOn=scope.length===0;
    const rows=props().slice().sort((a,b)=>a.nickname.localeCompare(b.nickname)).map(p=>
      '<label class="chkline scoperow" data-name="'+esc(p.nickname.toLowerCase())+'"><input type="checkbox" data-scope="'+p.id+'" '+(scope.indexOf(p.id)>=0?"checked":"")+'><span>'+esc(p.nickname)+'</span></label>').join("");
    return '<div class="propscope" id="'+id+'">'
      +'<label class="chkline"><input type="checkbox" id="'+id+'_all" '+(allOn?"checked":"")+' onchange="scopeAllToggle(\''+id+'\')"><span>All properties</span></label>'
      +'<input class="inp scope-search" placeholder="Filter properties" oninput="scopeFilter(\''+id+'\',this.value)" '+(allOn?'disabled':'')+' style="margin:6px 0">'
      +'<div class="scope-list" style="max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:var(--r);padding:6px 8px'+(allOn?';opacity:.45;pointer-events:none':'')+'">'+rows+'</div>'
      +'</div>';
  }
  return '<input class="inp" id="'+id+'" value="'+esc(v)+'" placeholder="'+esc(ph||"")+'">';
}
function scopeAllToggle(id){
  const wrap=document.getElementById(id); if(!wrap)return;
  const all=document.getElementById(id+"_all").checked;
  const list=wrap.querySelector(".scope-list"); const srch=wrap.querySelector(".scope-search");
  if(all){ wrap.querySelectorAll('[data-scope]').forEach(c=>c.checked=false); list.style.opacity=".45"; list.style.pointerEvents="none"; srch.disabled=true; }
  else { list.style.opacity=""; list.style.pointerEvents=""; srch.disabled=false; }
}
function scopeFilter(id,q){
  q=(q||"").trim().toLowerCase();
  document.getElementById(id).querySelectorAll(".scoperow").forEach(r=>{ r.style.display=(!q||r.dataset.name.indexOf(q)>=0)?"":"none"; });
}
function openRecordView(store,id){
  const col=COLLECTIONS[store]; const rec=db(store,[]).find(r=>r.id===id); if(!col||!rec)return;
  const body=col.fields.map(f=>{
    const n=f[0],l=f[1],t=f[2]; let v=rec[n];
    if(t==="attach") return attachCount(v)?'<div class="field"><label>'+esc(l)+'</label>'+attachView(v)+'</div>':"";
    if(t==="photolist"){ const arr=Array.isArray(v)?v:[]; return arr.length?'<div class="field"><label>'+esc(l)+'</label><div class="refgrid">'+arr.map(ph=>'<a class="refph" href="'+esc(ph.url)+'" target="_blank" rel="noopener"><img src="'+esc(ph.url)+'" alt=""><span>'+esc(ph.caption||"")+'</span></a>').join("")+'</div></div>':""; }
    if(t==="propscope"){ const arr=Array.isArray(v)?v:[]; return '<div class="field"><label>'+esc(l)+'</label><div>'+esc(arr.length?arr.map(pid=>propName(pid)).join(", "):"All properties")+'</div></div>'; }
    if(t==="peoplemulti"){ const arr=Array.isArray(v)?v:[]; return arr.length?'<div class="field"><label>'+esc(l)+'</label><div>'+esc(arr.join(", "))+'</div></div>':""; }
    if(t==="propref") return '<div class="field"><label>'+esc(l)+'</label><div>'+(v?esc(propName(v)):"Tropical Stays (company)")+'</div></div>';
    if(t==="checkbox") return '<div class="field"><label>'+esc(l)+'</label><div>'+(v?"Yes":"No")+'</div></div>';
    if(t==="url") return v?'<div class="field"><label>'+esc(l)+'</label><a href="'+esc(v)+'" target="_blank" rel="noopener">'+esc(v)+'</a></div>':"";
    if(v==null||v===""||(Array.isArray(v)&&!v.length)) return "";
    if(Array.isArray(v)) v=v.join(", ");
    return '<div class="field"><label>'+esc(l)+'</label><div style="white-space:pre-wrap">'+esc(v)+'</div></div>';
  }).join("");
  openModal(labelFor(store,rec), body||'<div class="muted">No details recorded.</div>',
    '<button class="btn ghost" onclick="closeModal()">Close</button><button class="btn" onclick="closeModal();openForm(\''+store+'\',\''+id+'\')">Edit</button>');

function openForm(store,id,prefill){
  const col=COLLECTIONS[store]; if(!col)return;
  if(!requireEdit(store))return;
  editCtx={store,id:id||null};
  const rec=id?db(store,[]).find(r=>r.id===id)||{}:(prefill||{});
  const body=col.fields.map(f=>{
    if(f[2]==="heading") return '<div class="form-sec">'+esc(f[1])+'</div>';
    let val=rec[f[0]];
    if(f[0]==="tags"&&Array.isArray(val)) val=val.join(", ");
    if(f[0]==="customIcons"&&Array.isArray(val)) val=val.map(x=>x.label?x.glyph+" | "+x.label:x.glyph).join(", ");
    if(f[2]==="checkbox") return '<div class="field">'+fieldInput(f,val)+'</div>';
    return '<div class="field"><label>'+esc(f[1])+'</label>'+fieldInput(f,val)+'</div>';
  }).join("");
  const warn=(store==="maintenance")?'<div class="note">Committing a contractor, a price, or an owner cost needs Isabell to approve. Tick the box so it shows on the dashboard.</div>':"";
  openModal((id?"Edit ":"Add ")+col.singular, body+customFormBlock(store,rec)+warn,
    '<button class="btn ghost" onclick="closeModal()">Cancel</button>'+(id?'<button class="btn danger" onclick="delRow(\''+store+'\',\''+id+'\',true)">Delete</button>':"")+'<button class="btn" onclick="saveForm()">Save</button>');
}
function saveForm(){
  const {store,id}=editCtx; const col=COLLECTIONS[store]; if(!col)return;
  const obj={};
  col.fields.forEach(f=>{
    if(f[2]==="heading") return;
    const el=document.getElementById("f_"+f[0]); if(!el)return;
    if(f[2]==="checkbox") obj[f[0]]=el.checked;
    else if(f[2]==="number") obj[f[0]]=el.value===""?null:Number(el.value);
    else if(f[2]==="checkboxes"||f[2]==="peoplemulti") obj[f[0]]=[...el.querySelectorAll('[data-cbx]')].filter(c=>c.checked).map(c=>c.getAttribute("data-cbx"));
    else if(f[2]==="attach") obj[f[0]]=attachClean(attachDraft["f_"+f[0]]);
    else if(f[2]==="photolist") obj[f[0]]=el.value.split("\n").map(s=>s.trim()).filter(Boolean).map(s=>{ const i=s.indexOf("|"); return i<0?{url:s.trim(),caption:""}:{url:s.slice(0,i).trim(),caption:s.slice(i+1).trim()}; });
    else if(f[2]==="propscope"){ const allEl=document.getElementById("f_"+f[0]+"_all"); obj[f[0]]=(allEl&&allEl.checked)?[]:[...el.querySelectorAll('[data-scope]')].filter(c=>c.checked).map(c=>c.getAttribute("data-scope")); }
    else if(f[0]==="tags") obj[f[0]]=el.value.split(",").map(s=>s.trim()).filter(Boolean);
    else if(f[0]==="customIcons") obj[f[0]]=el.value.split(",").map(s=>s.trim()).filter(Boolean).map(s=>{ const i=s.indexOf("|"); return i<0?{glyph:s.trim(),label:""}:{glyph:s.slice(0,i).trim(),label:s.slice(i+1).trim()}; });
    else obj[f[0]]=el.value;
  });
  const list=db(store,[]);
  if(id){ const i=list.findIndex(r=>r.id===id); if(i>=0){ const cu=collectCustom(store,list[i].custom); if(cu!==undefined)obj.custom=cu; list[i]=Object.assign(list[i],obj,{updated:nowISO()}); } }
  else { const cu=collectCustom(store,{}); if(cu!==undefined)obj.custom=cu; obj.id=uid(store==="properties"?"prop":store); obj.created=nowISO(); obj.updated=nowISO(); list.push(obj); }
  save(store,list); logAct(id?"edit":"add",store,labelFor(store,obj)); closeModal(); toast("Saved."); renderPage(currentTab);
}

function daysBetween(a,b){ return Math.round((Date.parse(a+"T00:00:00")-Date.parse(b+"T00:00:00"))/86400000); }

function claimChecklist(c){
  const items=c.items||[];
  const receipts = items.length>0 && items.every(i=>i.receipt===true);
  const photos = c.hasDamagePhotos===true;
  const screenshot = c.framing==="guest_reported" ? c.hasGuestScreenshot===true : true;
  const manual = c.manualTotal!=null && c.manualTotal!=="";
  const totalsMatch = !manual || Number(c.manualTotal)===claimTotal(c);
  const missing=[];
  if(items.length===0) missing.push("at least one item");
  if(!receipts) missing.push("a receipt or invoice on every item");
  if(!photos) missing.push("damage photos");
  if(c.framing==="guest_reported" && !screenshot) missing.push("the guest-report screenshot");
  if(!totalsMatch) missing.push("total to equal the sum of items");
  return {receipts,photos,screenshot,totalsMatch,ok:missing.length===0,missing};
}

  }
  if(items.length===1) return "Housekeeping found "+items[0].item+" "+(items[0].damage||"damage")+" after guest departure. Pictures attached.";
  return "Housekeeping found damage to "+names+" after guest departure. Pictures attached.";

function shieldFin(list){
  const parseAmt=s=>Number(String(s||"").replace(/[^0-9.]/g,""))||0;
  const approvedVal=list.reduce((s,c)=>s+(c.status==="approved"?claimTotal(c):c.status==="diff_approved"?parseAmt(c.approvedAmount||claimTotal(c)):0),0);
  const pendVals=["open","preparing","submitted"];
  const pendingVal=list.filter(c=>pendVals.indexOf(c.status)>=0).reduce((s,c)=>s+claimTotal(c),0);
  const disputeVal=list.filter(c=>c.status==="dispute"||c.status==="declined").reduce((s,c)=>s+claimTotal(c),0);
  const totalClaimed=list.reduce((s,c)=>s+claimTotal(c),0);
  const seg=approvedVal+pendingVal+disputeVal||1;
  return {approvedVal,pendingVal,disputeVal,totalClaimed,pA:approvedVal/seg,pP:pendingVal/seg,pD:disputeVal/seg,
    counts:{approved:list.filter(c=>c.status==="approved"||c.status==="diff_approved").length,
      pending:list.filter(c=>pendVals.indexOf(c.status)>=0).length,
      dispute:list.filter(c=>c.status==="dispute"||c.status==="declined").length}};
}

function shieldTable(list){
  const rows=list.slice().sort((a,b)=>(b.created||"").localeCompare(a.created||"")).map(c=>
    '<tr onclick="shieldOpen(\''+c.id+'\')" style="cursor:pointer">'
    +'<td class="mono">'+esc(c.reservationCode||"-")+(c.demo?' <span class="chip warn">demo</span>':'')+'</td>'
    +'<td>'+esc(propName(c.listing))+'</td>'
    +'<td>'+esc(c.guestName||"-")+'</td>'
    +'<td class="mono" style="white-space:nowrap">'+money(claimTotal(c))+'</td>'
    +'<td style="white-space:nowrap">'+(c.checkOut?'<span class="chip '+deadlineTone(claimDaysLeft(c),claimSubmitted(c))+'">'+esc(deadlineText(c))+'</span>':'<span class="muted" style="font-size:11px">set check-out</span>')+'</td>'
    +'<td><span class="chip '+claimTone(c.status)+'">'+esc(claimStatusLabel(c.status))+'</span>'+(c.status==="diff_approved"&&c.approvedAmount?' <span class="mono muted" style="font-size:10px">'+esc(c.approvedAmount)+'</span>':'')+'</td></tr>').join("");

    : '<div class="card"><div class="empty"><h4>No claims yet</h4><p>Build a claim, attach receipts and photos, submit to '+SHIELD_EMAIL+'.</p></div></div>';

function shieldCalendar(list){
  if(!shieldState.calMonth) shieldState.calMonth="2026-08";
  const ym=shieldState.calMonth; const ev=[];
  list.forEach(c=>{
    if(c.checkIn) ev.push({date:c.checkIn,label:"In "+(c.guestName||c.reservationCode||""),tone:"info"});
    if(c.checkOut){ ev.push({date:c.checkOut,label:"Out "+(c.reservationCode||""),tone:"muted"});
      const dl=claimDeadline(c); if(dl) ev.push({date:dl,label:"Deadline "+(c.reservationCode||""),tone:"alert"}); }
  });
  const inMonth=ev.filter(e=>String(e.date).slice(0,7)===ym);
  const missing=list.filter(c=>!c.checkOut).length;
  return calStyle()+calNav(ym,"shieldCalNav")+monthGrid(ym,inMonth)
    +'<div class="note" style="margin-top:12px">Deadlines plot 15 days after check-out. '+missing+' claim'+(missing===1?"":"s")+' are missing dates, backfill check-out in the claim to activate their deadline here.</div>';
}

    +'<text x="60" y="56" text-anchor="middle" style="font:600 20px var(--disp);fill:var(--ink)">'+pct(f.pA)+'%</text>'
    +'<text x="60" y="72" text-anchor="middle" style="font:9px var(--mono);fill:var(--muted)">APPROVED</text></svg>';
  const share=card("Portfolio share",'<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">'+donut
    +'<div style="font-size:12px;display:flex;flex-direction:column;gap:7px">'

    +'<div><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--warn);margin-right:7px"></span>Pending '+pct(f.pP)+'%</div>'
    +'<div><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--alert);margin-right:7px"></span>Disputed '+pct(f.pD)+'%</div></div></div>');

function viewShield(){
  if(shieldState.open) return viewClaim(shieldState.open);
  const list=claims();
  if(!shieldState.view) shieldState.view="table";
  const f=shieldFin(list); const view=shieldState.view;
  let body="";
  if(view==="calendar") body=shieldCalendar(list);
  else if(view==="tracker") body=shieldTracker(list,f);
  else body='<div style="display:flex;gap:8px;margin-bottom:14px"><button class="btn ghost sm" onclick="shieldDemo()">Add demo claim</button>'
      +(list.some(c=>c.demo)?'<button class="btn ghost sm" onclick="shieldClearDemo()">Clear demo</button>':'')
      +'<button class="btn sm" style="margin-left:auto" onclick="claimForm()">New claim</button></div>'+shieldTable(list);
  return head("Guesty Shield, financial recovery","Shield claims",
      "Assess first, makeup on sheets is not damage. For genuine guest damage buy the replacement, build the claim, submit to Guesty Shield within 15 days of check-out. Never AirCover.")
    +shieldRecoveryBar(f)
    +viewSeg(view,[["table","Claims table"],["calendar","Calendar"],["tracker","Percentage tracker"]],"shieldSetView")
    +body;
}

function itemDesc(i){ return ((i.damage||"")+(i.action?("; "+i.action):"")).trim()||(i.item||""); }
function buildClaimForm(c,incident,total,p){
  const L=[];
  L.push("Please send the completed form to: "+SHIELD_EMAIL);
  L.push("");
  L.push("GENERAL INFORMATION");
  L.push("Account Name: Tropical Stays Cairns");
  L.push("Reservation Confirmation Code: "+(c.reservationCode||""));
  L.push("Listing: "+((p?p.nickname:"")+(p&&p.address?" - "+p.address:"")));
  L.push("Guest Name: "+(c.guestName||""));
  L.push("Check-in: "+(c.checkIn||""));
  L.push("Check-out: "+(c.checkOut||""));
  L.push("");
  L.push("INCIDENT DESCRIPTION");
  L.push("Total Claim Amount: "+money(total));
  L.push("Currency: "+(c.currency||"AUD"));
  L.push("Incident Details: "+(incident||""));
  L.push("");
  L.push("ITEM DETAILS");
  (c.items||[]).forEach((i,ix)=>{
    L.push("Item "+(ix+1));
    L.push("Description of Damage/Corrective Action: "+itemDesc(i));
    L.push("Claim Amount for Item "+(ix+1)+": "+money(i.amount));
  });
  const ev=attachEmailLines(c.attachments);
  if(ev.length){ L.push(""); L.push("SUPPORTING EVIDENCE (attach to the email)"); ev.forEach(e=>L.push("- "+e)); }
  L.push("");
  L.push("REQUIRED SUPPORTING DOCUMENTS");
  L.push("- Receipt / Invoice for the replacement purchased items (required)");
  L.push("- Pictures / other proof of the damage (required)");
  L.push("- Photos of the items before the damages occurred (optional)");
  return L.join("\n");
}
function claimDocHTML(c){
  const p=propById(c.listing); const total=claimTotal(c); const incident=c.incidentDetails||genIncident(c);
  const e=s=>esc(s==null?"":String(s));
  const row=(k,v)=>'<p style="margin:3px 0"><b>'+k+':</b> '+e(v)+'</p>';
  const h3='margin:16px 0 6px;font-size:13pt;color:#204f34';
  let h='<div style="font-family:Calibri,Arial,sans-serif;font-size:11pt;color:#1a1a1a">';
  h+='<p>Please send the completed form to the following email address: <b>'+SHIELD_EMAIL+'</b></p>';
  h+='<h3 style="'+h3+'">General Information</h3>';
  h+=row("Account Name","Tropical Stays Cairns")+row("Reservation Confirmation Code",c.reservationCode)+row("Listing",(p?p.nickname:"")+(p&&p.address?" - "+p.address:""))+row("Guest Name",c.guestName)+row("Check-in",c.checkIn)+row("Check-out",c.checkOut);
  h+='<h3 style="'+h3+'">Incident Description</h3>';
  h+=row("Total Claim Amount",money(total))+row("Currency",c.currency||"AUD");
  h+='<p style="margin:3px 0"><b>Incident Details:</b> '+e(incident)+'</p>';
  h+='<h3 style="'+h3+'">Item Details</h3>';
  (c.items||[]).forEach((i,ix)=>{ h+='<p style="margin:8px 0 2px"><b>Item '+(ix+1)+'</b></p>'+row("Description of Damage/Corrective Action",itemDesc(i))+row("Claim Amount for Item "+(ix+1),money(i.amount)); });
  const ev=attachEmailLines(c.attachments);
  if(ev.length){ h+='<h3 style="'+h3+'">Supporting Evidence</h3><ul>'+ev.map(x=>'<li>'+e(x)+'</li>').join("")+'</ul>'; }
  h+='<h3 style="'+h3+'">Required Supporting Documents</h3><ul><li>Receipt / Invoice for the replacement purchased items (required)</li><li>Pictures / other proof of the damage (required)</li><li>Photos of the items before the damages occurred (optional)</li></ul>';
  h+='</div>';
  return h;
}
function downloadClaimDoc(id){
  const c=claimById(id); if(!c)return;
  const html='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>Guesty Shield Claim</title></head><body>'+claimDocHTML(c)+'</body></html>';
  const blob=new Blob(["\ufeff"+html],{type:"application/msword"});
  const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download="Guesty Shield Claim - "+((c.reservationCode||"claim").replace(/[^\w\- ]/g,""))+".doc"; document.body.appendChild(a); a.click(); setTimeout(()=>{ a.remove(); URL.revokeObjectURL(url); },100); toast("Word doc downloaded.");
}
function buildClaimEmail(c,total){
  const files=[];
  files.push("Receipts or invoices per item");
  files.push("Damage photos");
  if(c.framing==="guest_reported") files.push("Guest-report screenshot");
  const ev=attachEmailLines(c.attachments);
  const subject="Guesty Shield claim, "+(c.reservationCode||"reservation")+", Tropical Stays Cairns";
  let body="Hi Guesty Shield team,\n\nPlease find attached a Screen and Protect claim for reservation "+(c.reservationCode||"")+" at "+(propName(c.listing))+".\n\nTotal claim amount: "+money(total)+" AUD.\n\nAttached:\n"+files.map(f=>"- "+f).join("\n");
  if(ev.length) body+="\n\nEvidence links:\n"+ev.map(e=>"- "+e).join("\n");
  body+="\n\nIncident and item detail are in the attached claim form.\n\nKind regards,\nTropical Stays Cairns";
  return {subject,body};
}
function claimAttachEdit(id){ const c=claimById(id); if(!c)return; attachInit("cl_att", c.attachments||[]);
  openModal("Claim evidence and links",
    '<p class="muted" style="font-size:12px;margin:0 0 10px">Google Drive is the preferred repository. Uploaded photos stay local to this browser, so for anything you email, add a Drive or external link and it goes into the draft automatically.</p><div class="attach" id="cl_att">'+attachEditor("cl_att")+'</div>',
    '<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="claimAttachSave(\''+id+'\')">Save evidence</button>');

function viewMyDay(){
  const today=todayAU();
  const hr=parseInt(new Intl.DateTimeFormat("en-GB",{timeZone:"Australia/Brisbane",hour:"2-digit",hour12:false}).format(new Date()),10);
  const part=hr<12?"morning":hr<17?"afternoon":"evening";
  const openTasks=db("tasks",[]).filter(t=>t.status!=="done");
  const due=openTasks.filter(t=>t.due&&t.due<=today).sort((a,b)=>(a.due||"").localeCompare(b.due||""));
  const appr=db("maintenance",[]).filter(m=>m.needsApproval&&m.status!=="Done");
  const servOd=db("servicing",[]).filter(s=>s.status!=="Done"&&s.nextDue&&s.nextDue<today);
  const notes=db("dashNotes","");
  const line=t=>{ const od=t.due&&t.due<today; return '<div class="rowline"><span class="chip '+(t.priority==="P1"?"alert":t.priority==="P2"?"warn":"")+'">'+esc(t.priority||"P3")+'</span><div class="grow"><div>'+esc(t.title)+'</div><div class="muted mono" style="font-size:10px">'+esc(propName(t.property))+(t.due?' &middot; '+esc(t.due)+(od?' overdue':' today'):'')+'</div></div><button class="linkbtn" onclick="cycleTask(\''+t.id+'\')">'+esc(t.status)+'</button></div>'; };
  return head(new Intl.DateTimeFormat("en-AU",{timeZone:"Australia/Brisbane",weekday:"long",day:"numeric",month:"long"}).format(new Date()),
      "Good "+part+", Marlon",
      "Your shift in one screen, on Cairns time. Add a quick task and it lands here and on the dashboard.")
    +'<div class="grid2">'
      +card("Due today and overdue", due.length?due.map(line).join(""):'<div class="empty"><h4>All clear</h4><p>Nothing due. Log tasks as you shadow each process.</p></div>',
        '<div style="display:flex;gap:7px;margin-top:12px"><input class="inp" id="quickTask" placeholder="Quick task, then Enter" onkeydown="if(event.key===\'Enter\')quickAddTask()"><button class="btn sm" onclick="quickAddTask()">Add</button></div>')
      +card("Waiting on Isabell", appr.length?appr.map(m=>'<div class="rowline"><span class="chip warn">approval</span><div class="grow">'+esc(m.issue)+'<div class="muted mono" style="font-size:10px">'+esc(propName(m.property))+(m.cost?' &middot; '+esc(m.cost):'')+'</div></div></div>').join(""):'<div class="muted" style="font-size:12px">Nothing waiting on approval.</div>'
        +'<div class="sec-lbl" style="margin-top:14px">Overdue servicing</div>'+(servOd.length?servOd.map(s=>'<div class="rowline"><span class="chip alert">'+esc(s.type)+'</span><div class="grow mono" style="font-size:11px">'+esc(propName(s.property))+' &middot; due '+esc(s.nextDue)+'</div></div>').join(""):'<div class="muted" style="font-size:12px">None overdue.</div>'))
    +'</div>'
    +'<div class="grid2" style="margin-top:16px">'+agendaCard()+activityCard()+'</div>'
    +'<div class="card" style="margin-top:16px"><div class="card-hd"><h3>Shift notes</h3></div><div class="card-bd"><textarea class="inp" style="min-height:110px" placeholder="Handover, reminders, what Isabell needs to know" oninput="save(\'dashNotes\',this.value)">'+esc(notes)+'</textarea></div></div>';
}

function viewTeam(){
  const tasks=db("tasks",[]).filter(t=>t.status!=="done");
  const groups={};
  tasks.forEach(t=>{ const a=t.assignee&&t.assignee.trim()?t.assignee.trim():"Unassigned"; (groups[a]=groups[a]||[]).push(t); });
  const names=Object.keys(groups).sort((a,b)=>a==="Unassigned"?1:b==="Unassigned"?-1:a.localeCompare(b));
  const blocks=names.map(a=>{
    const rows=groups[a].sort((x,y)=>(x.due||"9999").localeCompare(y.due||"9999")).map(t=>{
      const od=t.due&&t.due<todayAU();
      return '<div class="rowline"><span class="chip '+(t.priority==="P1"?"alert":t.priority==="P2"?"warn":"")+'">'+esc(t.priority||"P3")+'</span><div class="grow"><div>'+esc(t.title)+'</div><div class="muted mono" style="font-size:10px">'+esc(propName(t.property))+(t.due?' &middot; '+esc(t.due)+(od?' overdue':''):'')+'</div></div><button class="chip '+statusTone(t.status)+'" style="cursor:pointer" onclick="cycleTask(\''+t.id+'\')">'+esc(t.status)+'</button></div>';
    }).join("");
    return card(a+"  ("+groups[a].length+")", rows);

      "The same task list grouped by who owns it. Assign a task an owner under Tasks and it shows up here, ready for the PH hotline team.")

function csvExport(store){
  const rows=db(store,[]); if(!rows.length){ toast("Nothing to export."); return; }
  const cols=[...new Set(rows.flatMap(r=>Object.keys(r)))];
  const cell=v=>{ v=(v==null)?"":Array.isArray(v)?v.join("; "):String(v); return '"'+v.replace(/"/g,'""')+'"'; };
  const csv=[cols.join(",")].concat(rows.map(r=>cols.map(c=>cell(r[c])).join(","))).join("\n");
  const b=new Blob([csv],{type:"text/csv"}); const a=document.createElement("a");
  a.href=URL.createObjectURL(b); a.download="ts-"+store+".csv"; a.click(); toast(store+" exported.");
}

function resetPin(){ openModal("Reset PIN","<p>This clears the current PIN. You set a new one on the lock screen.</p>",'<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="doResetPin()">Reset</button>'); }
function doResetPin(){ const s=db("settings",{}); s.pinHash=null; save("settings",s); closeModal(); lockStage="set"; lockApp(); document.getElementById("lockMsg").textContent="Set a new 4-digit PIN"; }
function exportData(){ const d={}; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k.startsWith(PFX)) d[k]=localStorage.getItem(k); } const b=new Blob([JSON.stringify(d,null,2)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="tropical-stays-hub-backup.json"; a.click(); toast("Backup downloaded."); }
function importData(ev){ const f=ev.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); Object.keys(d).forEach(k=>{ if(k.startsWith(PFX)) localStorage.setItem(k,d[k]); }); toast("Import complete."); renderPage(currentTab); updateSyncPill(); }catch(e){ toast("Import failed: invalid file."); } }; r.readAsText(f); }
function confirmWipe(){ openModal("Wipe all data","<p>This deletes every ts_ record in this browser and reseeds the 48 properties. Export first if unsure.</p>",'<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="doWipe()">Wipe</button>'); }
function doWipe(){ const keys=[]; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k.startsWith(PFX)) keys.push(k);} keys.forEach(k=>localStorage.removeItem(k)); initSeed(); closeModal(); toast("Wiped and reseeded."); go("dash"); }

/* ============================================================
   EDIT LOCK (soft read-only, unlocked by the access PIN)
   ============================================================ */
const EDIT_LOCKED_STORES=new Set(["properties"]);
function canEdit(store){ if(store && !EDIT_LOCKED_STORES.has(store)) return true; return !db("settings",{}).editLocked; }
function requireEdit(store){ if(canEdit(store))return true; toast("Property editing is locked. Unlock in the top bar."); return false; }
let elPinBuf="";
function toggleEditLock(){
  const s=db("settings",{});
  if(s.editLocked){
    elPinBuf="";
    openModal("Unlock property editing",
      '<p style="text-align:center;margin:0 0 12px;color:var(--ink2)">Enter the 4-digit PIN to unlock editing for Properties. Everything else stays editable without a PIN.</p>'
      +'<div class="dots" id="elDots" style="justify-content:center"></div>'
      +'<div class="keypad" id="elKeypad" style="margin:14px auto 0"></div>',
      '<button class="btn ghost" onclick="closeModal()">Cancel</button>');
    setTimeout(()=>{ drawDots("elDots",0); buildKeypad("elKeypad",elDigit,elClear,elTry); },40);
  } else { s.editLocked=true; save("settings",s); syncEditLockBtn(); toast("Property editing locked."); }
}
function elDigit(d){ if(elPinBuf.length<4){ elPinBuf+=d; drawDots("elDots",elPinBuf.length); if(elPinBuf.length===4) setTimeout(elTry,120); } }
function elClear(){ elPinBuf=""; drawDots("elDots",0); }
function elTry(){ if(checkPin(elPinBuf)){ const s=db("settings",{}); s.editLocked=false; save("settings",s); closeModal(); syncEditLockBtn(); toast("Property editing unlocked."); } else { elPinBuf=""; drawDots("elDots",0); toast("Incorrect PIN."); } }
function syncEditLockBtn(){ const b=document.getElementById("elockBtn"); if(!b)return; const locked=db("settings",{}).editLocked; b.classList.toggle("locked",!!locked); const sp=b.querySelector("span"); if(sp) sp.textContent=locked?"Props locked":"Props open"; b.title=locked?"Property editing is locked. Click to unlock with PIN.":"Property editing is open. Click to lock."; }

/* ============================================================
   ACTIVITY LOG + UNDO
   ============================================================ */
function labelFor(store,obj){ const o=obj||{}; return o.title||o.nickname||o.name||o.task||o.issue||o.question||o.trigger||o.item||o.label||((COLLECTIONS[store]||{}).singular)||store; }
function logAct(action,store,label){ const l=db("activity",[]); l.push({id:uid("act"),at:nowISO(),who:currentUserName(),action:action,store:store,label:label}); if(l.length>60) l.splice(0,l.length-60); save("activity",l); }
function timeShort(iso){ try{ return new Date(iso).toLocaleString([],{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}); }catch(e){ return ""; } }
function undoLastDelete(){ const ld=db("lastDeleted",null); if(!ld){ toast("Nothing to undo."); return; } const list=db(ld.store,[]); list.push(ld.record); save(ld.store,list); logAct("restore",ld.store,ld.label); save("lastDeleted",null); toast("Restored."); renderPage(currentTab); }
function activityCard(){
  const log=db("activity",[]).slice(-8).reverse(); const ld=db("lastDeleted",null);
  const body=log.length?'<div class="actlog">'+log.map(a=>'<div class="al"><span class="tag">'+esc(a.action)+'</span><div class="grow">'+esc(a.label)+'</div><span class="mono">'+esc(a.who||"Marlon")+' '+esc(timeShort(a.at))+'</span></div>').join("")+'</div>':'<div class="muted" style="font-size:12px">No activity yet. Adds, edits and deletes are logged here.</div>';
  const undo=ld?'<div style="margin-top:10px"><button class="btn ghost sm" onclick="undoLastDelete()">Undo delete: '+esc(ld.label||"item")+'</button></div>':'';
  return card("Recent activity",body+undo);
}

/* ============================================================
   CALENDAR (add-to-calendar links, in-app agenda)
   Two-way sync is a separate OAuth integration, out of scope here.
   ============================================================ */
function gcalUrl(title,ymd,details){
  const s=ymd.replace(/-/g,""); const e=dateAdd(ymd,1).replace(/-/g,"");
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(title)+"&dates="+s+"/"+e+"&details="+encodeURIComponent(details||"");
}
function calItem(kind,id){
  if(kind&&kind.indexOf("sub:")===0){ const t=db("tasks",[]).find(x=>x.id===kind.slice(4)); if(!t)return null; const s=(t.subtasks||[]).find(x=>x.id===id); if(!s)return null; return {title:"Subtask: "+s.title,date:s.due,details:"Part of "+t.title+(s.assignee?" ["+s.assignee+"]":"")}; }
  if(kind==="task"){ const t=db("tasks",[]).find(x=>x.id===id); if(!t)return null; return {title:"Task: "+t.title,date:t.due,details:(t.notes||"")+(t.property?" ["+propName(t.property)+"]":"")}; }
  if(kind==="serv"){ const s=db("servicing",[]).find(x=>x.id===id); if(!s)return null; return {title:(s.type||"Servicing")+": "+propName(s.property),date:s.nextDue,details:(s.vendor||"")+" "+(s.notes||"")}; }
  if(kind==="maint"){ const m=db("maintenance",[]).find(x=>x.id===id); if(!m)return null; return {title:(m.trade||"Maintenance")+": "+(m.issue||"")+(m.property?" ["+propName(m.property)+"]":""),date:m.due,details:(m.contractor||"")+" "+(m.notes||"")}; }
  if(kind==="claim"){ const c=db("shieldClaims",[]).find(x=>x.id===id); if(!c)return null; return {title:"Guesty Shield claim deadline: "+(c.reservationCode||"claim"),date:claimDeadline(c),details:"Submit within 15 days of check-out ("+(c.checkOut||"")+"). "+propName(c.listing)}; }
  return null;
}
function calBtns(kind,id){ return '<span class="calbtns"><button class="calbtn" onclick="event.stopPropagation();gcalOpen(\''+kind+'\',\''+id+'\')" title="Add to Google Calendar">Cal</button><button class="calbtn" onclick="event.stopPropagation();icsDownload(\''+kind+'\',\''+id+'\')" title="Download .ics">ics</button></span>'; }
function gcalOpen(kind,id){ const c=calItem(kind,id); if(!c||!c.date){ toast("No date on this item."); return; } window.open(gcalUrl(c.title,c.date,c.details),"_blank"); }
function icsDownload(kind,id){
  const c=calItem(kind,id); if(!c||!c.date)return; const s=c.date.replace(/-/g,""); const e=dateAdd(c.date,1).replace(/-/g,"");
  const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Tropical Stays//Ops Hub//EN","BEGIN:VEVENT","UID:"+id+"@tropicalstays","DTSTART;VALUE=DATE:"+s,"DTEND;VALUE=DATE:"+e,"SUMMARY:"+(c.title||"").replace(/[\n,;]/g," "),"DESCRIPTION:"+(c.details||"").replace(/[\n,;]/g," "),"END:VEVENT","END:VCALENDAR"].join("\r\n");
  const b=new Blob([ics],{type:"text/calendar"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=(c.title||"event").replace(/[^a-z0-9]+/gi,"-").toLowerCase()+".ics"; a.click(); toast("ICS downloaded.");
}
function agendaItems(){
  const items=[];
  db("tasks",[]).filter(t=>t.status!=="done"&&t.due).forEach(t=>items.push({date:t.due,kind:"task",id:t.id,label:t.title,sub:propName(t.property),tone:t.priority==="P1"?"alert":t.priority==="P2"?"warn":""}));
  db("servicing",[]).filter(s=>s.status!=="Done"&&s.nextDue).forEach(s=>items.push({date:s.nextDue,kind:"serv",id:s.id,label:(s.type||"Servicing"),sub:propName(s.property),tone:"info"}));
  return items.sort((a,b)=>a.date.localeCompare(b.date));
}
function agendaBucket(ymd){ const today=todayAU(); if(ymd<today)return"Overdue"; if(ymd===today)return"Today"; if(ymd===dateAdd(today,1))return"Tomorrow"; if(ymd<=dateAdd(today,7))return"This week"; return"Upcoming"; }
function agendaCard(){
  const items=agendaItems();
  if(!items.length) return card("Agenda",'<div class="muted" style="font-size:12px">No dated items. Add a due date to a task or a next-due to a servicing schedule and it appears here with an add-to-calendar link.</div>');
  const order=["Overdue","Today","Tomorrow","This week","Upcoming"]; const g={}; items.forEach(it=>{ const b=agendaBucket(it.date); (g[b]=g[b]||[]).push(it); });
  const body=order.filter(k=>g[k]).map(k=>'<div class="agrp"><div class="ah'+(k==="Overdue"?" od":"")+'">'+k+'</div>'+g[k].map(it=>
    '<div class="aitem"><span class="chip '+it.tone+'">'+esc(it.date)+'</span><div class="grow"><div>'+esc(it.label)+'</div><div class="muted mono" style="font-size:10px">'+esc(it.sub)+'</div></div>'
    +'<button class="cal" title="Add to Google Calendar" onclick="gcalOpen(\''+it.kind+'\',\''+it.id+'\')">Cal</button>'
    +'<button class="cal" title="Download .ics" onclick="icsDownload(\''+it.kind+'\',\''+it.id+'\')">ics</button></div>').join("")+'</div>').join("");
  return card("Agenda",body);
}

/* ============================================================
   BOOT
   ============================================================ */
async function boot(){
  renderTools();
  initPWA();
  try{ buildKeypad("vaultKeypad",vaultDigit,vaultClear,vaultTry); }catch(e){}
  try{ document.getElementById("modalX").onclick=closeModal; }catch(e){}
  try{ document.getElementById("overlay").addEventListener("click",e=>{ if(e.target.id==="overlay") closeModal(); }); }catch(e){}
  tickClocks(); setInterval(tickClocks,1000);
  const cloudReady=await cloudInit();
  if(cloudReady){
    const sess=await cloudRestore();
    if(sess){ try{ await cloudEnter(sess); return; }catch(e){ console.warn("auto-enter failed",e.message); } }
    buildNav();
    try{ updateSyncPill(); }catch(e){}
    const em=document.getElementById("loginEmail"); if(em) setTimeout(()=>em.focus(),60);
  } else {
    initSeed(); migrate(); migrateClaims(); buildNav();
    try{ updateSyncPill(); }catch(e){}
    const em=document.getElementById("loginEmail"); if(em) setTimeout(()=>em.focus(),60);
  }
}
boot();

</script>
